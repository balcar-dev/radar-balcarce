# El servidor MCP de sólo lectura de Radar Balcarce (ver worker.mjs y LEEME.md).
#
# ESTADO (16/10/2026): ESCRITO Y PROBADO, NO ACTIVADO. No tiene `routes` ni dominio, `workers_dev` está apagado y ningún workflow lo sube:
# subirlo a mano con `npx wrangler deploy` crea el Worker pero no lo hace alcanzable desde ningún lado. Para activarlo, seguir LEEME.md.

name = "radar-balcarce-mcp"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

# Para activarlo (sólo cuando LEEME.md lo diga): un subdominio propio, así la dirección del servidor no cambia aunque cambie el Worker.
# OJO: tiene que quedar acá arriba, antes de la primera tabla ([vars]); más abajo TOML lo tomaría como parte de otra tabla.
# routes = [
#   { pattern = "mcp.radarbalcarce.com", custom_domain = true },
# ]

[vars]
# De dónde lee: el sitio publicado. Sólo se abren direcciones de este origen.
ORIGEN = "https://radarbalcarce.com"
# Cuánto guarda lo que leyó del sitio (segundos). El sitio se arma cada 30 minutos: 5 minutos alcanzan y protegen al origen de una ráfaga.
CACHE_SEGUNDOS = "300"
# Qué sitios web pueden llamarlo desde un navegador. Los asistentes de IA llaman desde servidores y no mandan Origin, así que esto sólo
# importa para páginas web que quieran usarlo. "*" porque todo lo que devuelve ya es público y no hay cookies ni credenciales de por medio
# (la spec pide validar Origin para frenar a páginas maliciosas que le hablan a servidores LOCALES; acá no hay nada local que proteger).
ORIGENES_PERMITIDOS = "*"

# Límite de pedidos (Workers Rate Limiting; pide Wrangler 4.36 o más). Descomentar al activar. Es por ubicación y aproximado: la defensa de
# verdad es una regla de límite de pedidos en el WAF de Cloudflare sobre mcp.radarbalcarce.com (LEEME.md, paso 3).
# [[ratelimits]]
# name = "LIMITADOR"
# namespace_id = "7301"
#   [ratelimits.simple]
#   limit = 30
#   period = 60
