<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tablero · Radar Balcarce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { --tinta:#14161A; --papel:#F7F5EF; --rojo:#A8371F; --verde:#16615B; --ambar:#C99A16;
          --linea:#D5CFC0; --suave:#4A4F4B; --blanco:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--papel); color:var(--tinta);
         font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14px; }
  button { font-family:inherit; cursor:pointer; }

  header { background:var(--tinta); color:var(--papel); padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-family:Fraunces,Georgia,serif; font-size:21px; font-weight:700; }
  header h1 span { color:#E8A33C; }
  .estado { font-size:12px; color:#BDC1B8; display:flex; align-items:center; gap:7px; }
  .luz { width:8px; height:8px; border-radius:50%; background:#4FB07E; }
  .crece { flex-grow:1; }
  header select, header button { height:36px; border-radius:4px; font-size:13px; }
  header select { background:#1D2024; color:var(--papel); border:1px solid #3A3E42; padding:0 8px; }
  .btn-claro { background:#E8A33C; color:var(--tinta); border:none; padding:0 14px; font-weight:700; }
  .btn-claro:disabled { opacity:.5; cursor:wait; }

  nav { background:var(--blanco); border-bottom:1px solid var(--linea); padding:0 22px; display:flex; gap:4px; }
  nav button { background:none; border:none; padding:13px 14px; font-size:13px; font-weight:600; color:var(--suave); border-bottom:2px solid transparent; }
  nav button.on { color:var(--rojo); border-bottom-color:var(--rojo); }
  nav button b { background:var(--rojo); color:#fff; border-radius:9px; padding:1px 6px; font-size:11px; margin-left:5px; }

  main { padding:20px 22px 60px; }
  .dos { display:grid; grid-template-columns:1fr 440px; gap:20px; align-items:start; }
  @media (max-width:1100px) { .dos { grid-template-columns:1fr; } }

  .tarjeta { background:var(--blanco); border:1px solid var(--linea); border-radius:6px; padding:14px 16px; margin-bottom:10px; }
  .tarjeta.sel { border:2px solid var(--rojo); }
  .chapa { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; color:var(--suave); flex-wrap:wrap; }
  .punto { width:9px; height:9px; border-radius:50%; }
  .secc { text-transform:uppercase; letter-spacing:.06em; color:var(--rojo); }
  .rel { margin-left:auto; background:var(--papel); border:1px solid var(--linea); border-radius:3px; padding:2px 7px; font-weight:700; }
  .tit { margin:7px 0 0; font-family:Fraunces,Georgia,serif; font-size:17px; line-height:1.3; font-weight:600; }
  .mini { font-size:12px; color:var(--suave); line-height:1.5; margin-top:5px; }

  .lateral { position:sticky; top:20px; }
  label.campo { display:block; font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--suave); margin:12px 0 5px; }
  input[type=text], input[type=url], input[type=number], textarea, select.ancho {
    width:100%; padding:9px 11px; border:1px solid var(--linea); border-radius:4px;
    font-family:inherit; font-size:13px; background:var(--blanco); color:var(--tinta); }
  textarea { resize:vertical; line-height:1.5; }
  .acciones { display:flex; gap:8px; margin-top:14px; }
  .b { border:1px solid var(--linea); background:var(--blanco); border-radius:4px; height:42px; padding:0 14px; font-size:13px; font-weight:600; }
  .b.verde { background:var(--verde); color:#fff; border-color:var(--verde); flex-grow:1; }
  .b.rojo { color:var(--rojo); }
  .b.chico { height:32px; padding:0 10px; font-size:12px; }

  table { width:100%; border-collapse:collapse; background:var(--blanco); }
  th { text-align:left; font-size:10px; letter-spacing:.07em; color:var(--suave); padding:9px 10px; border-bottom:1px solid var(--tinta); }
  td { padding:10px; border-bottom:1px solid var(--linea); font-size:13px; vertical-align:middle; }
  td.n { font-weight:600; }
  .etiq { display:inline-block; background:var(--papel); border-radius:3px; padding:2px 7px; font-size:11px; font-weight:600; }
  .etiq.ok { background:#E3F0E9; color:#14533F; }
  .etiq.mal { background:#FBF3EE; color:#8C2D18; }
  .etiq.pausa { background:#FDF3E2; color:#6B5210; }

  h2 { font-family:Fraunces,Georgia,serif; font-size:20px; margin:0 0 12px; }
  .vacio { color:var(--suave); background:var(--blanco); border:1px dashed var(--linea); border-radius:6px; padding:26px; text-align:center; }
  .aviso { background:#FDF3E2; color:#6B5210; border-radius:4px; padding:9px 11px; font-size:12px; margin-top:8px; }
  .ok { background:#E3F0E9; color:#14533F; border-radius:4px; padding:9px 11px; font-size:12px; margin-top:8px; }

.fila-pieza {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0; border-bottom: 1px solid #23282c;
}
.fila-pieza .que { flex-grow: 1; min-width: 0; }
.fila-pieza .porque { font-size: 12px; color: #8C918D; margin-top: 3px; }
.fila-pieza .tipo {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 4px 8px;
  border-radius: 4px; flex-shrink: 0;
}
.fila-pieza .tipo.video { background: #7A4B8C; color: #fff; }
.fila-pieza .tipo.placa { background: #16615B; color: #fff; }
.fila-pieza a { text-decoration: none; display: inline-flex; align-items: center; }

/* --------------------------------------- calendario de las historias fijas */
.fila-horario {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 16px 0; border-bottom: 1px solid #23282c;
}
.fila-horario.apagada { opacity: 0.45; }
.fila-horario .que { flex-grow: 1; min-width: 240px; }
.fila-horario .porque { font-size: 12px; color: #8C918D; margin-top: 4px; }
.interruptor { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.interruptor input { width: 16px; height: 16px; accent-color: #C7381C; cursor: pointer; }
.fila-horario .dias { display: flex; gap: 5px; }
button.dia {
  width: 34px; height: 34px; border-radius: 17px; border: 1px solid #3A4046;
  background: transparent; color: #8C918D; font-weight: 700; font-size: 12.5px;
  cursor: pointer; font-family: inherit;
}
button.dia:hover { border-color: #6B6F6C; color: #F4F1EA; }
button.dia.on { background: #C7381C; border-color: #C7381C; color: #fff; }
input.hora {
  height: 38px; border-radius: 8px; border: 1px solid #3A4046; background: #15181b;
  color: #F4F1EA; padding: 0 10px; font-family: inherit; font-size: 14px;
}
input.hora:focus { outline: none; border-color: #C7381C; }
.ayuda { font-size: 13px; color: #8C918D; line-height: 1.6; max-width: 620px; }
</style>
</head>
<body>

<header>
  <h1>Radar <span>Balcarce</span></h1>
  <div class="estado"><span class="luz" id="luz"></span><span id="txtEstado">cargando…</span></div>
  <div class="crece"></div>
  <span id="quienSoy" style="font-size:12px;color:#BDC1B8"></span>
  <form method="POST" action="/salir" style="margin:0;display:inline-flex"><button type="submit" class="btn-claro">Salir</button></form>
  <button class="btn-claro" id="btnActualizar">Buscar noticias ahora</button>
</header>

<nav>
  <button data-t="cola" class="on">Para decidir <b id="nCola">0</b></button>
  <button data-t="publicadas">Publicadas</button>
  <button data-t="descartadas">Descartadas</button>
  <button data-t="bloqueadas">Frenadas</button>
  <button data-t="archivadas">Archivadas</button>
  <button data-t="fuentes">Fuentes</button>
  <button data-t="servicios">Clima y farmacias</button>
  <button data-t="agenda">Agenda</button>
  <button data-t="calendario">Calendario</button>
  <button data-t="piezas">Para redes <b id="nPiezas">0</b></button>
  <button data-t="buzon">Buzón <b id="nBuzon">0</b></button>
  <button data-t="avisos">Avisos</button>
  <button data-t="editorial">Cómo escribe la IA</button>
</nav>

<main id="main"></main>

<script>
let D = null, sel = null, tab = 'cola';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const puntos = { verde:'#16615B', amarillo:'#C99A16', rojo:'#A8371F' };
// Quién sos ya no lo elige el navegador: lo sabe el servidor por la
// sesión, y es eso lo que queda anotado en el historial.
let yo = null;

async function api(ruta, cuerpo) {
  const r = await fetch(ruta, cuerpo ? {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify(cuerpo)
  } : undefined);
  if (r.status === 401) { location.href = '/login'; return {}; }
  return r.json();
}

async function cargar(datos) {
  D = datos ?? await api('/api/estado');
  const pend = D.notas.filter((n) => n.estado === 'pendiente');
  $('#nCola').textContent = pend.length;
  $('#nBuzon').textContent = (D.buzon || []).filter((b) => b.estado === 'nuevo' || b.estado === 'pendiente').length;
  if (D.yo) { yo = D.yo; $('#quienSoy').textContent = D.yo; }
  if ($('#nPiezas')) $('#nPiezas').textContent = (D.piezas || []).length;
  $('#txtEstado').textContent = D.generado
    ? `última búsqueda ${new Date(D.generado).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})} · ${D.notas.length} historias · ${pend.length} sin decidir`
    : 'todavía no busqué noticias';
  $('#luz').style.background = D.corriendo ? '#C99A16' : '#4FB07E';
  pintar();
}

function pintar() {
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  const m = $('#main');
  if (tab === 'cola') m.innerHTML = vistaCola();
  if (tab === 'publicadas') m.innerHTML = vistaLista(['publicada', 'automatica'], 'Todavía no hay nada publicado.');
  if (tab === 'descartadas') m.innerHTML = vistaLista(['descartada'], 'No descartaste nada todavía.');
  if (tab === 'bloqueadas') m.innerHTML = vistaLista(['bloqueada'], 'No hay nada frenado. El semáforo rojo frena menores, víctimas y causas sin confirmar: si aparece algo acá, no se publica ni por error.');
  if (tab === 'archivadas') m.innerHTML = vistaLista(['archivada'], 'Nada archivado todavía. Acá caen solas las notas que pasaron 72 horas sin que nadie las decidiera.');
  if (tab === 'fuentes') m.innerHTML = vistaFuentes();
  if (tab === 'servicios') m.innerHTML = vistaServicios();
  if (tab === 'agenda') m.innerHTML = vistaAgenda();
  if (tab === 'calendario') m.innerHTML = vistaCalendario();
  if (tab === 'piezas') m.innerHTML = vistaPiezas();
  if (tab === 'buzon') m.innerHTML = vistaBuzon();
  if (tab === 'avisos') m.innerHTML = vistaAvisos();
  if (tab === 'editorial') m.innerHTML = vistaEditorial();
  conectar();
}

// ------------------------------------------------------------------- cola

function tarjeta(n) {
  return `<div class="tarjeta ${sel === n.id ? 'sel' : ''}" data-id="${n.id}">
    <div class="chapa">
      <span class="punto" style="background:${puntos[n.semaforo]}"></span>
      <span class="secc">${esc(n.seccion)}</span><span>·</span>
      <span>${esc(n.medios.join(' + '))}</span><span>·</span>
      <span>${esc(n.cuando)}</span>
      ${n.medios.length > 1 ? '<span class="etiq ok">coinciden ' + n.medios.length + '</span>' : ''}
      ${n.nombraBalcarce ? '<span class="etiq ok">nos nombran afuera</span>' : ''}
      ${n.conCuerpo === false ? '<span class="etiq">sin cuerpo</span>' : ''}
      <span class="rel">${n.relevancia}</span>
    </div>
    <div class="tit">${esc(n.titulo)}</div>
    <div class="mini">${esc(n.motivo)}</div>
  </div>`;
}

function vistaCola() {
  const pend = D.notas.filter((n) => n.estado === 'pendiente');
  const nota = D.notas.find((n) => n.id === sel);
  const viejas = pend.filter((n) => n.cuando.includes('días') || n.relevancia < 55);
  return `<div class="dos">
    <div>
      <h2>Para decidir · ${pend.length}</h2>
      ${viejas.length > 8 ? `<div class="aviso" style="display:flex;align-items:center;gap:12px;margin:0 0 12px">
        <span style="flex-grow:1">Hay ${viejas.length} que ya tienen días o puntaje bajo: es el archivo que las portadas muestran siempre. Sacalas de una y quedate con lo de hoy.</span>
        <button class="b chico" id="btnArchivar">Archivar esas ${viejas.length}</button></div>` : ''}
      ${pend.length ? pend.map(tarjeta).join('') : '<div class="vacio">No queda nada por decidir. Tocá “Buscar noticias ahora”.</div>'}
    </div>
    <div class="lateral">${nota ? detalle(nota) : '<div class="vacio">Tocá una noticia de la izquierda para verla, editarla y decidir.</div>'}</div>
  </div>`;
}

// El análisis interno de la nota (desde el 25/09): el nivel de verificación
// y su porqué, las claves, qué se sabe, qué falta confirmar, las fuentes con
// lo que aportó cada una, los antecedentes y el texto para Facebook. Es para
// quien decide: en la web el lector ve sólo el título, la bajada, el cuerpo y
// un desplegable con las fuentes (EDITORIAL.md). Plegado, para no tapar el
// texto. Se muestra, no se edita: si alguien corrige el texto, esto se borra
// (lo armó la IA sobre su versión).
const MINIMO_CUERPO = 70; // web/lib/cuerpo.js, PALABRAS_MINIMAS_CUERPO
const palabras = (s) => (String(s || '').match(/[\p{L}\p{N}]+/gu) || []).length;

function analisisInterno(n) {
  const v = n.verificacion;
  const fuentes = n.fuentesConsultadas || [];
  const antecedentes = n.antecedentes || [];
  const lista = (titulo, xs) => (xs && xs.length ? `<div style="margin-top:8px"><b>${titulo}</b><ul style="margin:2px 0 0 18px;padding:0">${xs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '');
  if (!v && !(n.claves || []).length && !(n.seSabe || []).length && !(n.noConfirmado || []).length && !fuentes.length && !n.textoRedes) return '';
  const fecha = (iso) => (iso ? new Date(iso).toLocaleDateString('es-AR') : '');
  return `<details class="analisis" style="margin-top:10px;border:1px solid var(--linea, #ddd);border-radius:8px;padding:8px 10px">
    <summary style="cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center">Análisis interno${v ? ` · verificación ${esc(v.nivel).toLowerCase()}` : ''}</summary>
    <div class="mini" style="margin-top:4px">
      ${v ? `<div><b>Verificación ${esc(v.nivel)}</b> · ${esc(v.porque)}${v.sugeridoPorIA && v.sugeridoPorIA !== v.nivel ? ` <i>(la IA sugería ${esc(v.sugeridoPorIA)})</i>` : ''}${v.nivel === 'BAJA' ? '<br><b>Con verificación baja no sale sola: espera a una persona.</b>' : ''}</div>` : ''}
      ${lista('Claves', n.claves)}
      ${lista('Qué se sabe', n.seSabe)}
      ${lista('Qué falta confirmar', n.noConfirmado)}
      ${fuentes.length ? `<div style="margin-top:8px"><b>Fuentes y qué aportó cada una</b><ul style="margin:2px 0 0 18px;padding:0">${fuentes.map((f) => `<li>${f.enlace ? `<a href="${esc(f.enlace)}" target="_blank" rel="noopener">${esc(f.medio || 'Nota original')}</a>` : esc(f.medio || '')}${f.oficial ? ' · oficial' : ''}${f.fecha ? ` · ${esc(fecha(f.fecha))}` : ''}${f.aporte ? ` — ${esc(f.aporte)}` : ''}</li>`).join('')}</ul></div>` : ''}
      ${antecedentes.length ? `<div style="margin-top:8px"><b>Antecedentes (notas nuestras anteriores)</b><ul style="margin:2px 0 0 18px;padding:0">${antecedentes.map((a) => `<li>${esc(fecha(a.fecha))} · ${esc(a.titulo)}</li>`).join('')}</ul></div>` : ''}
      ${n.textoRedes ? `<div style="margin-top:8px"><b>Para Facebook</b><br>${esc(n.textoRedes)}</div>` : ''}
      <div style="margin-top:8px"><i>Esto no se muestra en la web. Si corregís el título, la bajada o el cuerpo, se borra: lo armó la IA sobre su versión.</i></div>
    </div>
  </details>`;
}

/** El aviso de "sin cuerpo" arriba de los botones. */
function avisoSinCuerpo(n) {
  const p = palabras(n.cuerpo);
  if (p >= MINIMO_CUERPO) return '<div id="avisoCuerpo"></div>';
  return `<div id="avisoCuerpo" class="aviso">Esta nota no tiene cuerpo (${p} palabras; hacen falta ${MINIMO_CUERPO}). Sin cuerpo no sale sola en la web, y publicarla a mano pide confirmarlo.</div>`;
}

function detalle(n) {
  return `<div class="tarjeta">
    <div class="chapa">
      <span class="punto" style="background:${puntos[n.semaforo]}"></span>
      <span class="secc">${esc(n.seccion)}</span>
      <span class="rel">${n.relevancia}</span>
    </div>
    <div class="acciones" style="margin:0 0 4px">
      <button class="b" id="btnReescribir" data-reescribir="${n.id}" style="flex-grow:1">✨ Reescribir con IA${n.deIA === true ? ' (ya reescrita)' : n.deIA === false ? ' (falló, quedó la mecánica — reintentar)' : ''}</button>
    </div>
    <label class="campo" for="eT">TÍTULO · <span id="cuenta">0</span> (ideal 70, máximo 90)</label>
    <input type="text" id="eT" value="${esc(n.titulo)}">
    <label class="campo" for="eC">COPETE · lo que se ve arriba del todo</label>
    <textarea id="eC" rows="3">${esc(n.copete || '')}</textarea>
    <label class="campo" for="eB">CUERPO · la nota desarrollada, uno o más párrafos</label>
    <textarea id="eB" rows="6">${esc(n.cuerpo || '')}</textarea>
    <label class="campo" for="eG">GUION PARA LA VOZ</label>
    <textarea id="eG" rows="3">${esc(n.guion || '')}</textarea>
    ${analisisInterno(n)}
    <div class="mini" style="margin-top:10px">
      Fuente: ${esc(n.medios.join(' + '))} · ${esc(n.cuando)}<br>
      <a href="${esc(n.enlace)}" target="_blank" rel="noopener">Ver la nota original ↗</a>
    </div>
    <div class="aviso">${esc(n.motivo)}</div>
    ${avisoSinCuerpo(n)}
    <div class="acciones">
      <button class="b verde" data-acc="publicada">Publicar</button>
      <button class="b" data-acc="editar">Guardar cambios</button>
      <button class="b rojo" data-acc="descartada">Descartar</button>
    </div>
  </div>`;
}

const TITULOS = { publicada:'Publicadas', descartada:'Descartadas', bloqueada:'Frenadas por el semáforo rojo', archivada:'Archivadas por tiempo' };

function vistaLista(estados, vacio) {
  const ns = D.notas.filter((n) => estados.includes(n.estado));
  const auto = ns.filter((n) => n.estado === 'automatica').length;
  return `<h2>${TITULOS[estados[0]]} · ${ns.length}</h2>
    ${auto ? `<div class="ok" style="margin:0 0 12px">${auto} salieron solas porque el semáforo las marcó verdes: clima, farmacias, cortes de luz, agenda, deportes y comunicados. Si alguna no te gusta, la sacás desde acá.</div>` : ''}
    ${ns.length ? ns.map((n) => `<div class="tarjeta">
        <div class="chapa"><span class="secc">${esc(n.seccion)}</span><span>·</span>
          ${n.estado === 'automatica' ? '<span class="etiq ok">salió sola</span>'
            : n.estado === 'bloqueada' ? `<span class="etiq mal">${esc(n.motivo)}</span>`
            : `<span>${esc(n.decidioQuien || '')} ${n.decidioCuando ? new Date(n.decidioCuando).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}</span>`}
          <span class="rel">${n.relevancia}</span></div>
        <div class="tit">${esc(n.titulo)}</div>
        <div class="acciones">
          ${n.estado === 'bloqueada' ? '' : `<button class="b chico" data-volver="${n.id}">Volver a la cola</button>`}
          ${n.estado === 'automatica' ? `<button class="b chico rojo" data-bajar="${n.id}">Bajar de la web</button>` : ''}
        </div>
      </div>`).join('') : `<div class="vacio">${vacio}</div>`}`;
}

// ---------------------------------------------------------------- fuentes

function vistaFuentes() {
  return `<div class="dos">
    <div>
      <h2>Fuentes · ${D.fuentes.filter((f) => f.activa).length} activas de ${D.fuentes.length}</h2>
      <table>
        <tr><th>MEDIO</th><th>TEMAS</th><th>ALCANCE</th><th>ÚLTIMO CICLO</th><th>PESO</th><th></th></tr>
        ${D.fuentes.map((f) => `<tr>
          <td class="n">${esc(f.nombre)}<div class="mini" style="margin:2px 0 0">${esc(f.url).slice(0, 62)}</div>${f.nota ? `<div class="mini" style="margin-top:3px;font-style:italic">${esc(f.nota)}</div>` : ''}</td>
          <td>${(f.temas || []).map((t) => `<span class="etiq" style="margin:0 3px 3px 0">${esc(t)}</span>`).join('') || '<span class="mini">—</span>'}</td>
          <td>${esc(f.alcance)}${f.seccion ? `<div class="mini">→ ${esc(f.seccion)}</div>` : ''}</td>
          <td>${!f.activa ? '<span class="etiq pausa">en pausa</span>'
            : f.ultimo?.estado === 'ok' ? `<span class="etiq ok">${f.ultimo.notas} notas</span> <div class="mini">${esc(f.ultimo.frescura)}</div>`

// Cuándo sale cada historia fija. Cinco piezas, un renglón cada una: los
// días como botoncitos que se prenden y apagan, y la hora en un campo.

// Los videos y placas del día, para bajarlos desde el celular y subirlos a
// mano. Mientras Meta no apruebe la publicación automática, este es el
// camino real de todos los días.
function vistaPiezas() {
  const piezas = D.piezas || [];
  if (!piezas.length) {
    return `<div class="panelito"><h2>Para redes</h2>
      <p class="ayuda">No hay piezas generadas en las últimas 24 horas.</p>
      <p class="ayuda">Se arman en la PC con <code>node reels/plan.mjs --generar</code>.
      Después aparecen acá y las podés bajar desde donde estés.</p></div>`;
  }
  const peso = (b) => (b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.round(b / 1024)} KB`);
  const filas = piezas.map((x) => {
    const esVideo = x.archivo.endsWith('.mp4');
    const hora = new Date(x.cuando).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    return `<div class="fila-pieza">
      <span class="tipo ${esVideo ? 'video' : 'placa'}">${esVideo ? 'VIDEO' : 'PLACA'}</span>
      <div class="que"><b>${esc(x.archivo.replace(/\.(mp4|png)$/, ''))}</b>
        <div class="porque">${hora} · ${peso(x.bytes)}</div></div>
      <a class="btn-claro" href="/pieza/${encodeURIComponent(x.archivo)}" download>Bajar</a>
    </div>`;
  }).join('');
  return `<div class="panelito">
    <h2>Para redes</h2>
    <p class="ayuda">Lo que generó el plan del día. Bajalo y subilo a Instagram.
    Los videos son para reels e historias; las placas, para el feed.</p>
    ${filas}
  </div>`;
}

function vistaCalendario() {
  const dias = D.diasSemana ?? [];

    const botones = dias.map((d) => `
      <button class="dia ${(h.dias ?? []).includes(d.n) ? 'on' : ''}"
              data-pieza="${h.id}" data-dia="${d.n}" title="${esc(d.nombre)}">${d.corto}</button>`).join('');
    return `<div class="fila-horario ${h.activa === false ? 'apagada' : ''}">
      <div class="que">
        <label class="interruptor">

let borradorEvento = {};
let filtroContactos = 'mes';
const MES_CORTO = (m) => ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][m - 1] || m;
function canalesDe(c) {
  const k = c.canales || {};
  const partes = [];
  if (k.whatsapp) partes.push('WhatsApp ' + esc(k.whatsapp));
  if (k.telefono) partes.push('Tel. ' + esc(k.telefono));
  if (k.mail) partes.push(`<a href="mailto:${esc(k.mail)}">${esc(k.mail)}</a>`);
  if (k.instagram) partes.push(`<a href="https://www.instagram.com/${esc(String(k.instagram).replace(/^@/, ''))}" target="_blank" rel="noopener">${esc(k.instagram)}</a>`);
  if (k.facebook) partes.push(`<a href="${esc(k.facebook)}" target="_blank" rel="noopener">Facebook</a>`);
  if (k.web) partes.push(`<a href="${esc(k.web)}" target="_blank" rel="noopener">web</a>`);
  return partes.join(' · ') || 'sin canales cargados';
}
function leerFormularioEvento() {
  if (!$('#evN')) return { ...borradorEvento };
  const v = (s) => ($(s) ? $(s).value.trim() : '');
  return {
    ...borradorEvento,
    nombre: v('#evN'), fecha: v('#evF'), hora: v('#evH'), fechaHasta: v('#evFH'), horaHasta: v('#evHH'),
    categoria: v('#evC'), lugar: v('#evL'), direccion: v('#evD'), costo: v('#evCo'), organizador: v('#evO'),
    web: v('#evW'), descripcion: $('#evDe') ? $('#evDe').value : '', avisoPor: v('#evOr'),
  };
}
function CATEGORIAS_AGENDA_TXT(cat) { return (D.categoriasAgenda || {})[cat] || cat; }

// ------------------------------------------------------------- conexiones

function conectar() {
  // Calendario de las historias fijas
  document.querySelectorAll('button.dia').forEach((b) => {
    b.onclick = async () => {
      const pieza = D.horarios.find((h) => h.id === b.dataset.pieza);
      const dia = Number(b.dataset.dia);
      const dias = new Set(pieza.dias ?? []);
      if (dias.has(dia)) dias.delete(dia); else dias.add(dia);
      if (!dias.size) { alert('Tiene que quedar al menos un día.'); return; }
      cargar(await api('/api/horarios', { id: pieza.id, dias: [...dias] }));
    };
  });
  document.querySelectorAll('input[data-hora]').forEach((el) => {
    el.onchange = async () => {
      cargar(await api('/api/horarios', { id: el.dataset.hora, hora: el.value }));
    };
  });
  document.querySelectorAll('input[data-activa]').forEach((el) => {
    el.onchange = async () => {
      cargar(await api('/api/horarios', { id: el.dataset.activa, activa: el.checked }));
    };
  });

  document.querySelectorAll('.tarjeta[data-id]').forEach((el) => {
    el.onclick = () => { sel = el.dataset.id; pintar(); };
  });

  const arch = $('#btnArchivar');
  if (arch) {
    arch.onclick = async () => {
      const ids = D.notas.filter((n) => n.estado === 'pendiente'
        && (n.cuando.includes('días') || n.relevancia < 55)).map((n) => n.id);
      arch.disabled = true;
      cargar(await api('/api/lote', { ids, accion: 'descartada' }));
    };
  }

  const eT = $('#eT');
  if (eT) {
    const cuenta = () => { $('#cuenta').textContent = eT.value.length;
      $('#cuenta').style.color = eT.value.length > 90 ? 'var(--rojo)' : 'inherit'; };
    eT.oninput = cuenta; cuenta();
  }

  document.querySelectorAll('[data-acc]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      const pedido = {
        id: sel, accion: b.dataset.acc, titulo: $('#eT').value, copete: $('#eC').value, cuerpo: $('#eB').value, guion: $('#eG').value,
      };
      const d = await api('/api/nota', pedido);
      // Sin cuerpo, el servidor no publica: pide confirmarlo acá, con un
      // botón en la página (no con un cuadro del navegador).
      if (d.sinCuerpo) {
        b.disabled = false;
        const aviso = $('#avisoCuerpo');
        aviso.className = 'aviso';
        aviso.innerHTML = `<b>${esc(d.error)}</b><br>Sin cuerpo, el lector ve sólo el título y la bajada. ¿La publicás igual?
          <div class="acciones" style="margin-top:8px">
            <button class="b verde" id="btnPublicarSinCuerpo">Publicar igual, sin cuerpo</button>
            <button class="b" id="btnCancelarSinCuerpo">Mejor no</button>
          </div>`;
        aviso.scrollIntoView({ block: 'center', behavior: 'smooth' });
        $('#btnCancelarSinCuerpo').onclick = () => { aviso.className = ''; aviso.innerHTML = ''; };
        $('#btnPublicarSinCuerpo').onclick = async () => {
          $('#btnPublicarSinCuerpo').disabled = true;
          const r = await api('/api/nota', { ...pedido, confirmarSinCuerpo: true });
          sel = null;
          cargar(r);
        };
        return;
      }
      if (b.dataset.acc !== 'editar') sel = null;
      cargar(d);
    };
  });

  const btnR = $('#btnReescribir');
  if (btnR) {
    btnR.onclick = async () => {
      btnR.disabled = true;
      btnR.textContent = 'Escribiendo…';
      cargar(await api('/api/reescribir', { id: btnR.dataset.reescribir }));
    };
  }
  const btnAg = $('#btnAgenda');
  if (btnAg) {
    btnAg.onclick = async () => {
      btnAg.disabled = true; btnAg.textContent = 'Actualizando…';
      cargar(await api('/api/agenda/actualizar', {}));
    };
  }

  const btnCE = $('#btnCargarEvento');
  if (btnCE) {
    btnCE.onclick = async () => {
      const datos = leerFormularioEvento();
      if (!datos.nombre || !datos.fecha) { alert('Falta el nombre o la fecha.'); return; }
      const publicar = $('#evP').checked;
      if (publicar && !confirm('¿La fecha está confirmada por quien lo organiza? Si es aproximada, cargalo sin publicar.')) return;
      btnCE.disabled = true;
      const r = await api('/api/evento', { accion: 'agregar', ...datos, publicar });
      btnCE.disabled = false;
      if (r.error) { alert(r.error); return; }
      borradorEvento = {};
      cargar(r);
    };
  }
  // Lo que se escribe en el formulario se guarda al toque: si el panel se
  // vuelve a dibujar (cada vez que llega algo nuevo), no se pierde.
  document.querySelectorAll('#formEvento input[type=text], #formEvento input[type=url], #formEvento textarea, #formEvento select').forEach((el) => {
    el.oninput = () => { borradorEvento = leerFormularioEvento(); };
    el.onchange = el.oninput;
  });
  document.querySelectorAll('[data-soltar-borrador]').forEach((b) => {
    b.onclick = () => { borradorEvento = { ...leerFormularioEvento(), contactoId: null, anualId: null }; pintar(); };
  });
  document.querySelectorAll('[data-borrar-evento]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('¿Borrar este evento? Si estaba en la web, su página deja de existir.')) return;
      cargar(await api('/api/evento', { accion: 'borrar', id: b.dataset.borrarEvento }));
    };
  });
  document.querySelectorAll('[data-evento-accion]').forEach((b) => {
    b.onclick = async () => {
      const accion = b.dataset.eventoAccion;
      if (accion === 'publicar' && !confirm('¿La fecha está confirmada por quien lo organiza? Sólo se publican fechas confirmadas.')) return;
      const r = await api('/api/evento', { accion, id: b.dataset.id });
      if (r.error) { alert(r.error); return; }
      cargar(r);
    };
  });
  document.querySelectorAll('[data-filtro-contactos]').forEach((b) => {
    b.onclick = () => { borradorEvento = leerFormularioEvento(); filtroContactos = b.dataset.filtroContactos; pintar(); };
  });
  document.querySelectorAll('[data-evento-de-contacto]').forEach((b) => {
    b.onclick = () => {
      const c = (D.contactosAgenda || []).find((x) => x.id === b.dataset.eventoDeContacto);
      if (!c) return;
      borradorEvento = { ...leerFormularioEvento(), contactoId: c.id, anualId: null, organizador: c.quien.split(' (')[0] };
      pintar();
      $('#formEvento').scrollIntoView({ behavior: 'smooth' });
      $('#evN').focus();
    };
  });
  document.querySelectorAll('[data-confirmar-anual]').forEach((b) => {
    b.onclick = (ev) => {
      ev.preventDefault();
      const f = (D.calendarioAnualCompleto || []).find((x) => x.id === b.dataset.confirmarAnual);
      if (!f) return;
      borradorEvento = {
        ...leerFormularioEvento(), anualId: f.id, nombre: f.nombre, categoria: f.categoria,
        lugar: f.lugar && !/confirmar/i.test(f.lugar) ? f.lugar : '',
      };
      pintar();
      $('#formEvento').scrollIntoView({ behavior: 'smooth' });
      $('#evF').focus();
    };
  });

  document.querySelectorAll('[data-ver-mensaje]').forEach((b) => {
    b.onclick = () => {
      const ta = $('#msg-' + b.dataset.verMensaje);
      const abierto = ta.style.display !== 'none';
      ta.style.display = abierto ? 'none' : 'block';
      if (!abierto) { ta.focus(); ta.select(); }
      b.textContent = abierto ? 'Ver mensaje' : 'Ocultar (ya está seleccionado, Ctrl+C)';
    };
  });
  document.querySelectorAll('[data-contactado]').forEach((b) => {
    b.onclick = async () => {
      const r = await api('/api/agenda/contactado', { id: b.dataset.contactado, accion: b.dataset.accion || 'escribimos' });
      if (r.error) { alert(r.error); return; }
      cargar(r);
    };
  });

  const bzT = $('#bzT');
  if (bzT) {
    const actualizarRegla = () => {
      const t = (D.tiposBuzon || {})[bzT.value];
      $('#bzRegla').textContent = t ? t.regla : '';
    };
    bzT.onchange = actualizarRegla;
    actualizarRegla();
  }
  const btnBZ = $('#btnCargarBuzon');
  if (btnBZ) {
    btnBZ.onclick = async () => {
      const texto = $('#bzX').value.trim();
      if (!texto) { alert('Falta el texto.'); return; }
      cargar(await api('/api/buzon', {
        accion: 'agregar', tipo: $('#bzT').value, texto,
        contactoNombre: $('#bzN').value.trim(), contactoTelefono: $('#bzTel').value.trim(),
        anonimo: $('#bzAn').checked,
      }));
    };
  }
  document.querySelectorAll('[data-guardar-respuesta]').forEach((b) => {
    b.onclick = async () => {
      const resp = $('#resp-' + b.dataset.guardarRespuesta).value.trim();
      if (!resp) return;
      cargar(await api('/api/buzon', { accion: 'respuesta', id: b.dataset.guardarRespuesta, respuesta: resp }));
    };
  });
  document.querySelectorAll('[data-cambiar-estado]').forEach((sel) => {
    sel.onchange = async () => cargar(await api('/api/buzon', { accion: 'estado', id: sel.dataset.cambiarEstado, estado: sel.value }));
  });
  document.querySelectorAll('[data-cambiar-estado-simple]').forEach((b) => {
    b.onclick = async () => cargar(await api('/api/buzon', { accion: 'estado', id: b.dataset.cambiarEstadoSimple, estado: b.dataset.valor }));
  });
  document.querySelectorAll('[data-borrar-buzon]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('¿Borrar este envío?')) return;
      cargar(await api('/api/buzon', { accion: 'borrar', id: b.dataset.borrarBuzon }));
    };
  });

  document.querySelectorAll('[data-volver]').forEach((b) => {
    b.onclick = async () => cargar(await api('/api/nota', { id: b.dataset.volver, accion: 'pendiente' }));
  });
  document.querySelectorAll('[data-bajar]').forEach((b) => {
    b.onclick = async () => cargar(await api('/api/nota', { id: b.dataset.bajar, accion: 'descartada' }));
  });

  document.querySelectorAll('[data-pausa]').forEach((b) => {
    b.onclick = async () => cargar(await api('/api/fuente', { accion: 'activar', id: b.dataset.pausa }));
  });
  document.querySelectorAll('[data-borrar]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('¿Sacar esta fuente? Se puede volver a agregar después.')) return;
      cargar(await api('/api/fuente', { accion: 'borrar', id: b.dataset.borrar }));
    };
  });
  document.querySelectorAll('[data-peso]').forEach((i) => {
    i.onchange = async () => cargar(await api('/api/fuente', { accion: 'peso', id: i.dataset.peso, peso: i.value }));
  });

  const probar = $('#btnProbar');
  if (probar) {
    probar.onclick = async () => {
      const url = $('#fU').value.trim();
      if (!url) return;
      $('#resProbar').innerHTML = '<div class="mini" style="margin-top:10px">Probando…</div>';
      const r = await api('/api/probar', { url });
      if (r.ok) {
        $('#resProbar').innerHTML = `<div class="ok"><b>Anda.</b> ${r.cantidad} notas, última ${esc(r.frescura)}.
          ${r.textoCompleto ? 'Trae texto completo. ' : 'Trae sólo resumen. '}${r.conImagen ? 'Trae imagen.' : 'Sin imagen.'}
          <div style="margin-top:6px">${r.ejemplos.map((e) => '· ' + esc(e)).join('<br>')}</div></div>`;
        $('#btnSumar').disabled = false;
        if (!$('#fN').value) $('#fN').value = new URL(url).hostname.replace('www.', '');
      } else {
        $('#resProbar').innerHTML = `<div class="aviso"><b>No sirve:</b> ${esc(r.motivo)}</div>`;
        $('#btnSumar').disabled = true;
      }
    };
    $('#btnSumar').onclick = async () => {
      const d = await api('/api/fuente', {
        accion: 'agregar', nombre: $('#fN').value.trim(), url: $('#fU').value.trim(),
        alcance: $('#fA').value, seccion: $('#fS').value.trim() || null,
      });
      if (d.error) { $('#resProbar').innerHTML = `<div class="aviso">${esc(d.error)}</div>`; return; }
      cargar(d);
    };
  }

  document.querySelectorAll('[data-guardar-aviso]').forEach((b) => {
    b.onclick = async () => {
      const slot = b.dataset.guardarAviso;
      const nombre = $(`#av-${slot}-n`).value.trim();
      if (!nombre) { alert('Le falta el nombre del comercio.'); return; }
      cargar(await api('/api/avisos', {
        slot, nombre, texto: $(`#av-${slot}-t`).value.trim(), logo: $(`#av-${slot}-l`).value.trim(),
      }));
    };
  });
  document.querySelectorAll('[data-borrar-aviso]').forEach((b) => {
    b.onclick = async () => {
      const slot = b.dataset.borrarAviso;
      if (!confirm('¿Sacar este aviso? El espacio vuelve a quedar vacío.')) return;
      cargar(await api('/api/avisos', { slot, nombre: '' }));
    };
  });
}

document.querySelectorAll('nav button').forEach((b) => {
  b.onclick = () => { tab = b.dataset.t; pintar(); };
});

$('#btnActualizar').onclick = async () => {
  const b = $('#btnActualizar');
  b.disabled = true; b.textContent = 'Buscando…';
  cargar(await api('/api/actualizar', {}));
  b.disabled = false; b.textContent = 'Buscar noticias ahora';
};

cargar();
setInterval(() => { if (!sel) cargar(); }, 60000);
</script>
</body>
</html>
