# Manda un WhatsApp de prueba y muestra lo que contestó CallMeBot.
# Se corre a mano (Actions → Prueba de WhatsApp → Run workflow).
name: Prueba de WhatsApp

on:
  workflow_dispatch:

# Sólo lee el repositorio: no guarda nada.
permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node redes/probar-whatsapp.mjs
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
