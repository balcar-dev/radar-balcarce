name: Reloj de Cloudflare

# Sube (o actualiza) el reloj propio que reemplaza a cron-job.org (infra/reloj-cloudflare/, 9/10/2026).
# SÓLO a mano: mientras no se corra, no cambia nada y sigue mandando cron-job.org.
# Antes hay que cargar en GitHub (Settings > Secrets and variables > Actions) el secreto RELOJ_GITHUB_TOKEN: un token de grano fino de la
# cuenta del repositorio, sólo para este repositorio, con "Actions: lectura y escritura". Lo pega una persona (nunca en un chat).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Subir el reloj
        working-directory: infra/reloj-cloudflare
        run: npx --yes wrangler@4.139.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Cargar el secreto del reloj
        working-directory: infra/reloj-cloudflare
        run: printf '%s' "$RELOJ_GITHUB_TOKEN" | npx --yes wrangler@4.139.0 secret put GITHUB_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELOJ_GITHUB_TOKEN: ${{ secrets.RELOJ_GITHUB_TOKEN }}
