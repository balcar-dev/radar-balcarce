# Auditoría semanal: mira lo PUBLICADO (medidas de imágenes, íconos, SEO) y si
# los datos de formatos de las redes (redes/formatos.mjs) están al día.
# Deja el resultado en web/data/auditoria.json y avisa por WhatsApp si algo está
# mal. Si esta auditoría deja de correr, el vigilante lo avisa (redes/vigilar.mjs).
#
# Los lunes a las 9 (hora de Balcarce). También se puede correr a mano.
# Suma la auditoría de la semana del contrato de las redes (redes/auditar-redes.mjs).

# Costo: cero. No usa Gemini; sólo mira lo publicado (los repos públicos no pagan minutos de Actions).
name: Auditoría

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: write

concurrency:
  group: auditoria
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auditar
        run: node redes/auditar.mjs
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      # El contrato de Facebook e Instagram de los últimos 7 días contra lo que
      # Meta tiene publicado de verdad: porcentaje de cumplimiento por red y por
      # pieza, y qué días fallaron. Sólo se ve en el registro (no manda WhatsApp:
      # a las 9 ya sale el mensaje de las estadísticas y CallMeBot bloquea si se
      # abusa). No frena la auditoría si Meta no contesta.
      - name: Auditar el contrato de las redes (semana)
        continue-on-error: true
        run: node redes/auditar-redes.mjs --semana
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}

      - name: Guardar el resultado
        if: always()
        run: |
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/auditoria.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Auditoría semanal · $(date '+%d/%m')"
            # El mismo ciclo que "Actualizar la web" (actualizar.yml), "Redes" y
            # "Piezas" (28/09): traer lo de las otras corridas, resolver choques
            # de web/data/ con lo de esta corrida (en un rebase, "theirs" es el
            # commit propio) y reintentar hasta tres veces. Con un solo intento,
            # si otra corrida subía justo en el medio, el resultado de la auditoría se perdía.
            for intento in 1 2 3; do
              if ! git pull --rebase; then
                # Sólo los archivos en conflicto, y sólo si son de web/data/.
                chocan=$(git diff --name-only --diff-filter=U)
                echo "$chocan" | grep -qvE "^web/data/" && { echo "Conflicto fuera de web/data: $chocan"; git rebase --abort; exit 1; }
                echo "$chocan" | xargs -r git checkout --theirs --
                echo "$chocan" | xargs -r git add --
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              git push && break
              sleep 5
            done
            git fetch -q origin main
            [ "$(git rev-list --count origin/main..HEAD)" = 0 ] || { echo "No se pudo guardar el resultado de la auditoría después de tres intentos"; exit 1; }
          fi
