# Auditoría semanal: mira lo PUBLICADO (medidas de imágenes, íconos, SEO) y si
# los datos de formatos de las redes (redes/formatos.mjs) están al día.
# Deja el resultado en web/data/auditoria.json y avisa por WhatsApp si algo está
# mal. Si esta auditoría deja de correr, el vigilante lo avisa (redes/vigilar.mjs).
#
# Los lunes a las 9 (hora de Balcarce). También se puede correr a mano.
# Suma la auditoría de la semana del contrato de las redes (redes/auditar-redes.mjs).

name: Auditoría

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: write

concurrency:
  group: auditoria
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auditar
        run: node redes/auditar.mjs
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      # El contrato de Facebook e Instagram de los últimos 7 días contra lo que
      # Meta tiene publicado de verdad: porcentaje de cumplimiento por red y por
      # pieza, y qué días fallaron. Sólo se ve en el registro (no manda WhatsApp:
      # a las 9 ya sale el mensaje de las estadísticas y CallMeBot bloquea si se
      # abusa). No frena la auditoría si Meta no contesta.
      - name: Auditar el contrato de las redes (semana)
        continue-on-error: true
        run: node redes/auditar-redes.mjs --semana
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}

      - name: Guardar el resultado
        if: always()
        run: |
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/auditoria.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Auditoría semanal · $(date '+%d/%m')"
            git pull --rebase
            git push
          fi
