# Auditoría semanal: mira lo PUBLICADO (medidas de imágenes, íconos, SEO) y si
# los datos de formatos de las redes (redes/formatos.mjs) están al día.
# Deja el resultado en web/data/auditoria.json y avisa por WhatsApp si algo está
# mal. Si esta auditoría deja de correr, el vigilante lo avisa (redes/vigilar.mjs).
#
# Los lunes a las 9 (hora de Balcarce). También se puede correr a mano.

name: Auditoría

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: write

concurrency:
  group: auditoria
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auditar
        run: node redes/auditar.mjs
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      - name: Guardar el resultado
        if: always()
        run: |
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/auditoria.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Auditoría semanal · $(date '+%d/%m')"
            git pull --rebase
            git push
          fi
