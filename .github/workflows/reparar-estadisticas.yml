# Repara los días de web/data/estadisticas.json que quedaron en cero o incompletos por una falla de la API de Cloudflare (15/10/2026).
# Usa los secretos que ya están en GitHub (CLOUDFLARE_ACCOUNT_ID y CLOUDFLARE_ANALYTICS_TOKEN): nadie tiene que pegar nada.
# Por defecto SOLO SIMULA y muestra el antes y el después en el resumen de la corrida. Con "aplicar" = true escribe y sube el archivo.
# Detalle del criterio: redes/reparar-estadisticas.mjs.
name: Reparar las estadísticas

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'true = escribir y subir el archivo. Vacío o false = sólo simular.'
        required: false
        default: 'false'
      con_hoy:
        description: 'true = pedir también el día de hoy (por defecto no: la medición de las 9 y las 21 lo corrige sola).'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: reparar-estadisticas
  cancel-in-progress: false

jobs:
  reparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: America/Argentina/Buenos_Aires
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Simular
        run: |
          EXTRA=""
          if [ "${{ inputs.con_hoy }}" = "true" ]; then EXTRA="--con-hoy"; fi
          node redes/reparar-estadisticas.mjs $EXTRA | tee simulacion.txt
          { echo '### Simulación de la reparación de estadísticas'; echo '```'; cat simulacion.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Aplicar y subir
        if: ${{ inputs.aplicar == 'true' }}
        run: |
          EXTRA=""
          if [ "${{ inputs.con_hoy }}" = "true" ]; then EXTRA="--con-hoy"; fi
          node redes/reparar-estadisticas.mjs --aplicar $EXTRA
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/estadisticas.json
          if git diff --cached --quiet; then echo "Nada para subir."; exit 0; fi
          git commit -m "Estadísticas: días reparados con la API de Cloudflare"
          for intento in 1 2 3; do
            if ! git pull --rebase; then
              chocan=$(git diff --name-only --diff-filter=U)
              echo "$chocan" | grep -qvE "^web/data/" && { echo "Conflicto fuera de web/data: $chocan"; git rebase --abort; exit 1; }
              echo "$chocan" | xargs -r git checkout --theirs --
              echo "$chocan" | xargs -r git add --
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
            git push && break
            sleep 5
          done
