# Corre la comparación de fotos con IA (ingesta/fotos.mjs) sobre toda la
# tapa de hoy, para ver cómo quedarían las notas con foto real antes de
# construir el banco (PENDIENTES.md, "El banco de fotos propio"). Sólo lee
# la tapa y deja un reporte como artefacto de esta corrida: no publica nada,
# no toca portada.json ni el sitio. Se corre a mano: Actions → Probar banco
# de fotos → Run workflow.
name: Probar banco de fotos

on:
  workflow_dispatch:
    inputs:
      maximo:
        description: 'Cuántas notas revisar como mucho (la tapa de hoy trae bastante menos)'
        default: '100'

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node ingesta/probar-fotos.mjs ${{ inputs.maximo }}
        env:
          GEMINI_API_KEY_CLASIFICACION: ${{ secrets.GEMINI_API_KEY_CLASIFICACION }}
          GEMINI_API_KEY_REDACCION: ${{ secrets.GEMINI_API_KEY_REDACCION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-fotos
          path: web/data/_prueba-fotos.json
          retention-days: 14
