# Sube el sitio a Cloudflare Pages, que es quien sirve radarbalcarce.com.
#
# Desde el 24/09 el dominio apunta a Cloudflare (los nameservers de DonWeb se
# cambiaron a Cloudflare; `www` redirige al dominio sin `www` con una regla de
# Cloudflare).
#
# Por qué Cloudflare: permite publicidad y uso comercial, con ancho de banda
# ilimitado. El sitio se exporta como archivos estáticos puros (ver
# next.config.mjs), así que no hace falta nada especial del lado del hosting.
#
# DESDE EL 17/10/2026 ES SÓLO A MANO, DE RESCATE (regla 189). Lo de cada media hora lo sube "Actualizar la web" (actualizar.yml) con lo que
# ya compiló, sin compilar dos veces. Este workflow sirve para volver a subir el sitio tal como está en main sin buscar noticias: si una
# subida falló y no se quiere esperar a la vuelta siguiente, o después de tocar algo de la web a mano (Actions → "Cloudflare Pages" →
# Run workflow). Compila, archiva en R2 lo que está por salir, sube y avisa a Bing, igual que la vuelta.
#
# SECRETOS (Settings → Secrets and variables → Actions; los pega una persona):
#   CLOUDFLARE_API_TOKEN    token con permiso Account.Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID   el ID de la cuenta de Cloudflare
# Variable opcional CLOUDFLARE_PROJECT: el nombre del proyecto de Pages (si no
# está, "radar-balcarce").

name: Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

# Sólo lee el repositorio: lo que sube va a Cloudflare con su propio token.
permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-24.04
    # Tarda unos 3 minutos (compilar ~2,5 y subir). Veinticinco es de sobra y corta una subida colgada.
    timeout-minutes: 25
    env:
      # Que "hoy" y las horas que se compilan sean los de Balcarce, no UTC.
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # La caché de npm (9/10): no baja de nuevo todo en cada corrida de las cada-media-hora.
          cache: npm
          cache-dependency-path: web/package-lock.json

      # La caché del compilador de Next: la corrida arranca con lo ya calculado y no en frío. Si no existe o falla, compila de cero, como antes.
      - uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-

      - name: Instalar
        working-directory: web
        run: |
          n=0; until npm ci --no-audit --no-fund; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "npm ci falló (intento $n), se reintenta"; sleep 20; done

      - name: Compilar el sitio
        working-directory: web
        run: npm run build
        env:
          SITIO: https://radarbalcarce.com
          # Los canales propios (regla 257): sólo salen en el sitio si una persona carga la variable en GitHub; vacías, no aparece nada.
          WHATSAPP_CANAL_URL: ${{ vars.WHATSAPP_CANAL_URL }}
          TELEGRAM_CANAL_URL: ${{ vars.TELEGRAM_CANAL_URL }}
          BLUESKY_URL: ${{ vars.BLUESKY_URL }}
          # De dónde salen las fotos de las notas: vacío = el propio sitio (web/lib/fotos.js).
          FOTOS_BASE: ${{ vars.FOTOS_BASE }}
          # Educación, Salud y el menú con "Más secciones" (regla 187): sólo con la variable en "Si"; vacía, el sitio de siempre.
          SECCIONES_NUEVAS: ${{ vars.SECCIONES_NUEVAS }}

      # El ARCHIVO PERMANENTE (16/10/2026; docs/salud-tecnica/ARCHIVO-PERMANENTE-IMPLEMENTACION.md). Antes de subir el sitio, guarda en el
      # depósito R2 las notas que están por salir del sitio por el tope (las de los próximos ~4 días al ritmo de la última semana: --margen=auto)
      # y borra de ahí lo retirado (retiradas.json o lo que el semáforo sacó), con su foto. Sólo sube lo nuevo o lo que cambió.
      # DORMIDO hasta que exista la variable de GitHub R2_ARCHIVO (= radar-archivo): se crea DESPUÉS de la carga inicial con
      # "Archivo permanente (producción)". Si falla, NO frena el despliegue (continue-on-error): avisa por mail en el paso de abajo, deja
      # estado.json con ok=false y el vigilante lo anota. Corta solo a los 6 minutos (lo que no llegó a subir sale en la vuelta siguiente).
      - name: Archivar las notas por salir (R2)
        id: archivo
        if: ${{ vars.R2_ARCHIVO != '' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -o pipefail
          node web/scripts/archivar-a-r2.mjs --subir --borrar --produccion --bucket="$R2_ARCHIVO" --margen=auto --limite-segundos=360 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          R2_ARCHIVO: ${{ vars.R2_ARCHIVO }}
          TOPE_DE_NOTAS: ${{ vars.TOPE_DE_NOTAS }}
          R2_RESPALDOS: ${{ vars.R2_RESPALDOS }}
          R2_FOTOS: ${{ vars.R2_FOTOS }}
          R2_PIEZAS: ${{ vars.R2_PIEZAS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Un aviso por mail (el Worker del vigilante; de respaldo, WhatsApp). Con `clave`, el Worker no repite el mismo aviso en 6 horas aunque
      # falle cada media hora. Nunca frena nada.
      - name: Avisar si el archivo permanente falló
        if: ${{ always() && steps.archivo.outcome == 'failure' }}
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import { avisar } from './redes/avisar-por-mail.mjs';
          const corrida = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const texto = [
            'Radar Balcarce: falló el paso del archivo permanente (guardar en R2 las notas que están por salir del sitio).',
            'El sitio SÍ se publicó igual. Las notas tienen unos días de margen antes de salir, pero si sigue fallando se pueden perder páginas viejas,',
            'y lo retirado (menores, víctimas) podría no haberse borrado del archivo: mirar la corrida.',
            `Detalle: ${corrida}`,
          ].join('\n');
          const r = await avisar({ asunto: 'Falló el archivo permanente (R2): el sitio se publicó igual', texto, clave: 'archivo-r2-fallo', nivel: 'alta' });
          console.log(r.ok ? `Aviso enviado por ${r.via}.` : `El aviso no salió: ${r.motivo}`);
          JS
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          VIGILANTE_TOKEN: ${{ secrets.VIGILANTE_TOKEN }}

      # Direct Upload: se sube lo que ya compilamos, sin que Cloudflare
      # corra su propio build. Así no cuenta contra el límite de 500 builds
      # gratis por mes — con una corrida cada 30 minutos, lo superaríamos
      # el primer día si Cloudflare tuviera que compilar cada vez.
      #
      # La versión de wrangler va fija (la última 4.x al 25/09): con "@4" a
      # secas, una versión nueva con un cambio de comportamiento podía romper
      # el despliegue sin que nadie tocara nada. Para subirla, cambiar el
      # número a mano y correr este workflow a mano para probar.
      - name: Subir a Cloudflare Pages
        working-directory: web
        run: npx --yes wrangler@4.139.0 pages deploy out --project-name="$PROYECTO" --branch=main
        env:
          PROYECTO: ${{ vars.CLOUDFLARE_PROJECT || 'radar-balcarce' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Después de subir, se le avisa a Bing (IndexNow, sin cuenta ni clave secreta) qué notas nuevas hay (redes/indexnow.mjs). Es un aviso:
      # si falla, el despliegue sigue verde.
      - name: Avisar a Bing de las notas nuevas
        continue-on-error: true
        run: node redes/indexnow.mjs
