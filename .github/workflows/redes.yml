# Publica solo en Facebook e Instagram, con la PC apagada.
#
# CADA CORRIDA hace tres cosas:
#
#   1. Facebook: si hay una nota fuerte y reciente, publica UNA (cinco por día como
#      máximo, entre las 8 y las 22, nunca Política ni Policiales).
#   2. El reloj: mira qué historia o reel de Instagram le toca a esta hora
#      (clima, farmacia, noticias, podcast…) y todavía no salió hoy.
#   3. Si toca alguna: la arma con la voz de Gemini y la sube a Instagram y a la
#      página de Facebook (el mismo video, como historia o reel).
#
# Cuando no toca ninguna pieza, la corrida termina en segundos y no instala
# nada. Los horarios y las reglas están en docs/07-REDES.md.
#
# EL DISPARADOR ES EXTERNO (cron-job.org), no el planificador propio de GitHub.
# El 21/09 el planificador de GitHub llegó a dejar cinco horas entre dos
# corridas que debían distar treinta minutos, y una tarde entera sin ejecutar
# ninguna: la farmacia de esa noche se perdió y hubo que publicarla a mano.
# cron-job.org llama a este workflow cada 30 minutos (7 a 23, hora de Balcarce)
# con la acción "reloj", desde una cuenta de radarbalcarce@gmail.com con un
# token de GitHub limitado a este repositorio (permiso Actions: lectura y
# escritura). Cada pieza tiene su propia ventana (ver redes/piezas.mjs): si el
# disparador se atrasa, igual alcanza; lo que no sale dentro de su ventana se
# pierde. Un segundo disparador de respaldo sigue siendo la corrida de
# "Actualizar la web".
#
# INTERRUPTOR: la variable REDES_ACTIVAS ("Si") en Settings → Secrets and
# variables → Actions → Variables. Con otro valor, Facebook sólo simula (dice qué
# publicaría) y el reloj de Instagram ni mira la hora: no arma ninguna pieza,
# así no se gasta la voz paga de Gemini en videos que no se van a publicar
# (redes/reloj.mjs, con la misma regla que publicar.mjs: estaActivo, 28/09).
#
# SECRETOS: META_TOKEN (publicar) y GEMINI_API_KEY_REDES (la voz).
#
# A mano (pestaña Actions → "Redes" → Run workflow):
#   reloj      lo mismo que hace cron-job.org cada 30 minutos (es la acción que
#              manda ese disparador)
#   verificar  comprueba que el token, la página y el Instagram andan
#   facebook   sólo la elección de Facebook

name: Redes

on:
  # Un segundo disparador: cuando termina "Actualizar la web". El planificador de
  # GitHub es tan impuntual que el 21/09 no ejecutó ninguna corrida de esta
  # cola entre las 19:00 y las 21:00, mientras que "Actualizar la web" sí corrió
  # (tarde, pero corrió). Colgarse de esa corrida da más oportunidades por día.
  workflow_run:
    workflows: ["Actualizar la web"]
    types: [completed]
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        options: [reloj, verificar, facebook]
        default: reloj

# Una sola corrida a la vez, compartida con "Piezas": si dos publicaran juntas,
# la misma pieza podría salir dos veces antes de anotarse en el libro.
concurrency:
  group: redes
  cancel-in-progress: false

jobs:
  redes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # para guardar el libro de lo ya publicado
    env:
      # Que "hoy" y las horas sean las de Balcarce y no las de UTC.
      TZ: America/Argentina/Buenos_Aires

    steps:
      # Siempre la última versión de main, no la que había cuando se DISPARÓ la
      # corrida: si una corrida espera a la anterior (el candado "redes"), sin
      # esto trabaja con el libro viejo y publica de nuevo lo que la anterior ya
      # había publicado. Pasó el 25/09: el repaso de la mañana salió dos veces.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # ------------------------------------------------ comprobar el acceso
      - name: Comprobar el acceso a Meta
        if: github.event.inputs.accion == 'verificar'
        run: node redes/publicar.mjs --verificar
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}

      # ------------------------------------------------------------ Facebook
      - name: Facebook
        if: github.event.inputs.accion != 'verificar'
        run: node redes/publicar.mjs --facebook
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          REDES_ACTIVAS: ${{ vars.REDES_ACTIVAS }}
          SITIO: https://radarbalcarce.com

      # ------------------------------------------ Instagram: el reloj y las piezas
      # Sólo con las redes prendidas (28/09): con REDES_ACTIVAS en "No" el
      # reloj seguía pidiendo la pieza, se armaba con la voz paga de Gemini cada
      # 30 minutos y no se publicaba (no queda en el libro, así que la vuelta
      # siguiente la volvía a pedir). El interruptor lo lee el propio reloj con
      # estaActivo (redes/elegir.mjs), la misma regla que publicar.mjs: apagado,
      # devuelve hay=false. Antes el `if` comparaba con seis formas fijas y " si"
      # daba otra respuesta que en publicar.mjs. always(): una falla del paso de
      # Facebook ya no tumba las piezas de Instagram de esa vuelta.
      - name: Ver qué pieza toca ahora
        id: reloj
        if: always() && github.event.inputs.accion != 'verificar' && github.event.inputs.accion != 'facebook'
        run: node redes/reloj.mjs
        env:
          REDES_ACTIVAS: ${{ vars.REDES_ACTIVAS }}

      # Sólo si toca algo: acá sí se instala (resvg para las placas, ffmpeg para
      # el video).
      - name: Instalar
        id: instalar
        if: always() && steps.reloj.outputs.hay == 'true'
        run: |
          n=0; until npm ci --no-audit --no-fund; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "npm ci falló (intento $n), se reintenta"; sleep 20; done

      # La memoria de voces (C-16, 8/10/2026): un texto con la misma voz y el mismo estilo se pide UNA vez al día; si la pieza se arma de
      # nuevo (falló ffmpeg, Meta contestó con error, el reloj la volvió a pedir) se reusa el audio y no se gasta cupo (reels/voz-gemini.mjs).
      - name: Restaurar la memoria de voces
        uses: actions/cache/restore@v4
        with:
          path: .cache/voz
          key: voz-${{ github.run_id }}
          restore-keys: |
            voz-

      - name: Armar las piezas que tocan
        id: armar
        if: always() && steps.instalar.outcome == 'success'
        run: node reels/plan.mjs --generar --solo=${{ steps.reloj.outputs.solo }}
        env:
          GEMINI_API_KEY_REDES: ${{ secrets.GEMINI_API_KEY_REDES }}
          VOZ_CACHE: ${{ github.workspace }}/.cache/voz

      - name: Guardar la memoria de voces
        if: always() && hashFiles('.cache/voz/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/voz
          key: voz-${{ hashFiles('.cache/voz/*.json') }}

      - name: Publicar en Instagram y en la página de Facebook
        if: always() && steps.armar.outcome == 'success'
        run: node redes/publicar.mjs --piezas
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          REDES_ACTIVAS: ${{ vars.REDES_ACTIVAS }}

      # Las piezas quedan unos días por si hay que revisar cómo salieron.
      - name: Guardar las piezas para revisarlas
        if: always() && steps.reloj.outputs.hay == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: piezas-${{ github.run_id }}
          path: |
            reels/salida/*.mp4
            reels/salida/piezas.json
          if-no-files-found: ignore
          retention-days: 3

      # La dirección pública de cada podcast (Instagram y Facebook), para que
      # su nota en la web enlace al video (web/lib/notas-propias.js). Sólo
      # pregunta, no publica; si Meta todavía no la da, se vuelve a pedir en
      # la vuelta siguiente. Nunca frena la corrida.
      - name: Completar las direcciones de los podcasts
        if: always() && github.event.inputs.accion != 'verificar'
        continue-on-error: true
        run: node redes/publicar.mjs --enlaces
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}

      # ----------------------------------------------------- el libro
      # El libro dice qué salió ya. Sin guardarlo, la próxima vuelta publicaría
      # lo mismo otra vez. Se guarda aunque un paso anterior haya fallado a la
      # mitad: lo que sí salió no tiene que repetirse.
      - name: Guardar lo publicado
        if: always() && github.event.inputs.accion != 'verificar'
        run: |
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/redes.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Redes: libro de publicaciones · $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
            # La otra corrida (la que actualiza la web) y la vigilancia también
            # empujan: se traen sus cambios antes de subir los nuestros, con el
            # mismo ciclo que "Actualizar la web" (actualizar.yml). Si chocan en
            # un archivo de web/data/, gana lo de esta corrida (en un rebase,
            # "theirs" es el commit propio): el libro sólo lo escriben esta
            # corrida y "Piezas", que comparten el candado "redes". Y si otro
            # sube justo en el medio, se reintenta. Antes era un solo pull y un
            # solo push (28/09): si el push fallaba, el libro no se guardaba y
            # la vuelta siguiente volvía a publicar lo mismo.
            for intento in 1 2 3; do
              if ! git pull --rebase; then
                # Sólo los archivos en conflicto, y sólo si son de web/data/.
                chocan=$(git diff --name-only --diff-filter=U)
                echo "$chocan" | grep -qvE "^web/data/" && { echo "Conflicto fuera de web/data: $chocan"; git rebase --abort; exit 1; }
                echo "$chocan" | xargs -r git checkout --theirs --
                echo "$chocan" | xargs -r git add --
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              git push && break
              sleep 5
            done
            git fetch -q origin main
            [ "$(git rev-list --count origin/main..HEAD)" = 0 ] || { echo "No se pudo guardar el libro después de tres intentos: la vuelta siguiente puede repetir lo publicado"; exit 1; }
          fi
