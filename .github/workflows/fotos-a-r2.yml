# Sube las fotos de las notas (web/public/fotos-notas/) a un depósito de Cloudflare R2 (etapa 1 del plan de arquitectura, 8/10/2026).
#
# SE CORRE A MANO (Actions → "Fotos a R2" → Run workflow). Sólo COPIA: no borra nada del repositorio ni cambia lo que ve el lector.
# Para que el sitio use las fotos del depósito hay que, después: (1) conectar al depósito un dominio propio (por ejemplo
# fotos.radarbalcarce.com: Cloudflare → R2 → el depósito → Settings → Custom domains), y (2) poner la variable de GitHub FOTOS_BASE con
# ese dominio (https://fotos.radarbalcarce.com). Con FOTOS_BASE todas las direcciones de foto de las páginas salen de web/lib/fotos.js.
#
# Hace falta (ver docs/propuestas/PASOS-PARA-USTEDES.md):
#   variable R2_FOTOS               el nombre del depósito de fotos (por ejemplo radar-fotos)
#   secreto  CLOUDFLARE_API_TOKEN   con el permiso "Workers R2 Storage: Edit" (el mismo del respaldo)
#   secreto  CLOUDFLARE_ACCOUNT_ID  ya existe

name: Fotos a R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fotos-a-r2
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R2_FOTOS: ${{ vars.R2_FOTOS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Subir las fotos
        run: |
          if [ -z "$R2_FOTOS" ]; then
            echo "Falta la variable R2_FOTOS (el nombre del depósito). Ver docs/propuestas/PASOS-PARA-USTEDES.md." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          npm install --no-save --no-audit --no-fund wrangler@4.139.0 > /dev/null
          cd web/public
          total=$(ls fotos-notas | wc -l)
          echo "Subiendo $total fotos a $R2_FOTOS…"
          subir() {
            f="$1"
            case "${f##*.}" in jpg|jpeg) tipo=image/jpeg;; png) tipo=image/png;; webp) tipo=image/webp;; *) tipo=application/octet-stream;; esac
            for intento in 1 2 3; do
              npx wrangler r2 object put "$R2_FOTOS/fotos-notas/$f" --file "fotos-notas/$f" --content-type "$tipo" --cache-control "public, max-age=31536000, immutable" --remote > /dev/null 2>&1 && return 0
              sleep 3
            done
            echo "FALLÓ: $f"
            return 1
          }
          export -f subir
          export R2_FOTOS
          if ls fotos-notas | xargs -P 6 -I{} bash -c 'subir "{}"'; then
            echo "- Se subieron $total fotos a **$R2_FOTOS**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Alguna foto **FALLÓ** (mirar el registro de la corrida). Se puede volver a correr: sobrescribe." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
