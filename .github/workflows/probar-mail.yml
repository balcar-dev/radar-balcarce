# Prueba a mano que los avisos por MAIL llegan (15/10/2026). Manda un mail de prueba a radarbalcarce@gmail.com a través del Worker
# del vigilante (POST /avisar), con el secreto VIGILANTE_TOKEN que ya está cargado en GitHub: nadie tiene que pegar nada en ningún lado.
# Si el mail no sale, lo dice acá (y probaría el WhatsApp de respaldo). No escribe nada en el repositorio.
name: Probar el aviso por mail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VIGILANTE_TOKEN: ${{ secrets.VIGILANTE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mandar el mail de prueba
        run: |
          node --input-type=module -e "
          import { avisarPorMail } from './redes/avisar-por-mail.mjs';
          const r = await avisarPorMail({ asunto: 'Prueba del aviso por mail', texto: 'Radar Balcarce\nSi estás leyendo esto, los avisos por mail funcionan. Mandado a mano desde GitHub el ' + new Date().toISOString(), nivel: 'info' });
          console.log(JSON.stringify(r));
          if (!r.ok) process.exit(1);
          "
