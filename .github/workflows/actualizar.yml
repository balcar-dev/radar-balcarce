# Busca noticias y actualiza la web, sin depender de que haya una PC prendida.
#
# Corre en los servidores de GitHub cada media hora (lo dispara cron-job.org; el
# `schedule` de abajo es el respaldo). Lo que hace es lo mismo que hace el panel
# en casa: leer las fuentes activas (las de ingesta/fuentes.mjs y las del cruce
# de medios, ingesta/fuentes-cruce.mjs; la lista entera, en FUENTES.md), cruzar
# los medios, clasificar, poner puntaje, y escribir web/data/portada.json.
#
# La diferencia está en las decisiones humanas. Acá no hay panel, así que se
# leen de web/data/decisiones.json, que el panel exporta al repositorio cada
# vez que alguien publica o descarta algo. O sea:
#
#   · Lo que sale solo (el semáforo verde, el clima, la farmacia, la agenda)
#     se actualiza siempre, con la computadora apagada.
#   · Lo que ustedes decidieron a mano se respeta hasta la última vez que el
#     panel estuvo prendido y sincronizó.
#
# Quien PUBLICA es Cloudflare Pages: cuando esta corrida termina bien, arranca
# sola "Cloudflare Pages" (cloudflare-deploy.yml), que compila y sube el sitio.

name: Actualizar la web

on:
  schedule:
    # Cada 30 minutos, pero en el minuto 7 y el 37 y no en punto ni y media:
    # esos dos son los más cargados de GitHub y ahí las corridas se demoraban
    # o se salteaban (cada 2 a 6 horas en vez de cada 30 minutos). El horario
    # es UTC: en Balcarce son 3 horas menos, pero como corre todo el día da lo
    # mismo.
    - cron: '7,37 * * * *'
  # Y a mano, desde la pestaña Actions, por si hace falta forzar una vuelta.
  workflow_dispatch:

# Que no se pisen dos corridas: la de las 10:30 no arranca si la de las 10:00
# todavía está trabajando.
concurrency:
  group: actualizar-web
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    # Hoy tarda entre 2 y 3 minutos y medio. Veinte es de sobra, y corta una
    # corrida colgada (un pedido que no contesta) antes de que se pise con la
    # de la media hora siguiente.
    timeout-minutes: 20
    permissions:
      contents: write # para poder commitear portada.json
    env:
      # Que "hoy" y las horas sean los de Balcarce y no los de UTC.
      TZ: America/Argentina/Buenos_Aires

    steps:
      # Siempre la última versión de main, no la que había cuando se DISPARÓ la
      # corrida: si una corrida espera a la anterior (el candado "actualizar-web"),
      # sin esto arranca de los datos viejos, sin lo que la anterior acababa de
      # subir (y sin el libro de redes ni las decisiones que llegaron mientras
      # tanto). La misma regla que en redes.yml y piezas.yml, donde el 25/09 el
      # repaso de la mañana salió dos veces por esto.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Hace falta: el armado usa reels/ (placas con resvg, ffmpeg para fotos y collages) y web/lib (react).
      - name: Instalar
        run: |
          n=0; until npm ci --no-audit --no-fund; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "npm ci falló (intento $n), se reintenta"; sleep 20; done
      - name: Instalar (web)
        working-directory: web
        run: |
          n=0; until npm ci --no-audit --no-fund; do n=$((n+1)); [ $n -ge 3 ] && exit 1; echo "npm ci falló (intento $n), se reintenta"; sleep 20; done

      # El NÚCLEO LEGAL de las pruebas sí corre en cada vuelta, antes de armar y publicar (hallazgo M1 de la auditoría del 15/10/2026).
      # La suite entera (las 2.000) NO: antes corría acá 48 veces por día y una prueba de diseño que fallaba (el 11/10, las escenas de
      # video) dejaba la web 7 horas sin actualizarse, sin que ninguna noticia estuviera mal. Esa suite corre cuando alguien cambia el
      # código y una vez por semana (workflow "Pruebas", pruebas.yml). Pero lo que no se puede publicar mal (semáforo, menores y
      # víctimas, sepelios, verificador, cola de las personas, retiradas y correcciones con motivo, cuerpo mínimo) no puede esperar a
      # un mail a quien hizo el push: la lista está en pruebas/nucleo-legal.txt, tarda unos 3 segundos y no toca la red.
      # Si falla, la vuelta se corta acá (no se arma ni se publica nada: la web queda como estaba) y el paso de abajo avisa.
      # Lo demás que protege cada vuelta es el propio armado: si generar los datos, compilar o revisar el SEO fallan, no se commitea.
      - name: Núcleo legal de las pruebas
        id: nucleo
        run: npm run test:nucleo

      # Sin esto la vuelta fallaba "en silencio" (sólo el mail de GitHub). Va por el mismo camino que los demás avisos (mail por el
      # Worker del vigilante y, de respaldo, WhatsApp; redes/avisar-por-mail.mjs). Con `clave`, el Worker no repite el mismo aviso en
      # 6 horas aunque la vuelta falle cada media hora. No frena nada: la vuelta ya está fallada.
      - name: Avisar que falló el núcleo legal
        if: failure() && steps.nucleo.outcome == 'failure'
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import { avisar } from './redes/avisar-por-mail.mjs';
          const corrida = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const texto = [
            'Radar Balcarce: falló una prueba del núcleo legal.',
            'La web NO se actualizó en esta vuelta (queda como estaba) y no va a actualizarse hasta que se arregle.',
            `Cambio: ${String(process.env.GITHUB_SHA ?? '').slice(0, 7)}`,
            `Detalle: ${corrida}`,
          ].join('\n');
          const r = await avisar({ asunto: 'Falló el núcleo legal de las pruebas: la web no se actualiza', texto, clave: 'nucleo-legal-fallo', nivel: 'alta' });
          console.log(r.ok ? `Aviso enviado por ${r.via}.` : `El aviso no salió: ${r.motivo}`);
          JS
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          VIGILANTE_TOKEN: ${{ secrets.VIGILANTE_TOKEN }}

      # La ingesta en sí no necesita nada (fetch y expresiones regulares).
      # Las claves de Gemini son para la reescritura automática de las notas
      # que van a salir sin que nadie las mire (ver reels/reescritura.mjs):
      # primero intenta con la de redacción, y si no está o se quedó sin
      # cupo, sigue con la de redes. Si ninguna de las dos anda, la nota sale
      # igual con el resumen mecánico de la fuente — esto nunca frena nada.
      # La memoria del cruce de medios (ingesta/cruce.mjs): lo que publicaron
      # todos los medios en las últimas 36 horas, para contar cuántos cuentan
      # cada hecho. No va al repositorio: la guarda la caché de Actions entre
      # corridas. Si se pierde, se rearma sola con los índices de noticias.
      # En la misma caché quedan las notas enteras de esta vuelta
      # (.cache/celular-notas.json): las lee "Panel del celular" (panel.yml)
      # cuando el celular pide que la IA escriba una nota que espera.
      - name: Memoria del cruce de medios
        uses: actions/cache@v4
        with:
          path: .cache
          key: cruce-${{ github.run_id }}
          restore-keys: cruce-

      - name: Buscar noticias y armar los datos
        working-directory: web
        run: node scripts/generar-datos.mjs
        env:
          GEMINI_API_KEY_REDACCION: ${{ secrets.GEMINI_API_KEY_REDACCION }}
          GEMINI_API_KEY_REDES: ${{ secrets.GEMINI_API_KEY_REDES }}
          # La lectura con IA (decide desde el 27/09, plan V2.2). Si no está cargada,
          # usa la de redacción (gratis); nunca la de redes.
          GEMINI_API_KEY_CLASIFICACION: ${{ secrets.GEMINI_API_KEY_CLASIFICACION }}
          # Groq (28/09): el segundo proveedor de la lectura con IA. Faltaba acá:
          # el código ya la leía (ingesta/lectura-ia.mjs), pero sin pasarla en el
          # workflow nunca llegaba a `process.env` y el respaldo no se probaba
          # nunca de verdad (encontrado el 28/09 al armar la prueba del banco de fotos).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Sólo para contarle al panel del celular si las redes están prendidas
          # (celular-estado.json, 29/09). Acá no se publica nada en las redes.
          REDES_ACTIVAS: ${{ vars.REDES_ACTIVAS }}
          # El tope de notas con página (16/10/2026, archivo permanente). Vacías = como siempre (MAXIMO_EN_ARCHIVO, 3.700). TOPE_DE_NOTAS sólo
          # BAJA el tope, y sólo con el archivo permanente prendido (R2_ARCHIVO): ver web/lib/archivo.js (topeDeNotas) y la guía
          # docs/salud-tecnica/ARCHIVO-PERMANENTE-IMPLEMENTACION.md, paso 7.
          TOPE_DE_NOTAS: ${{ vars.TOPE_DE_NOTAS }}
          R2_ARCHIVO: ${{ vars.R2_ARCHIVO }}

      # El sitio se compila acá antes de publicar. Si no, un cambio que
      # rompía Next se descubría recién cuando fallaba el despliegue — con la
      # web anterior sirviéndose mientras tanto, pero sin que nadie se
      # enterara de que dejó de actualizarse.
      #
      # Si no compila, no se commitea: la web se queda como está.
      - name: Compilar el sitio
        working-directory: web
        run: npm run build
        env:
          SITIO: https://radarbalcarce.com
          FOTOS_BASE: ${{ vars.FOTOS_BASE }}

      # Que lo importante haya quedado en el HTML. Sin esto, alguien toca
      # layout.js dentro de seis meses, se lleva puesto el Open Graph y no
      # se entera nadie hasta que una nota compartida llega pelada.
      - name: Revisar que el SEO siga en pie
        working-directory: web
        run: node scripts/revisar-seo.mjs

      - name: Guardar si cambió algo
        run: |
          git config user.name "Radar Balcarce"
          # El mail interno de la cuenta balcar-dev, que GitHub reconoce. No
          # cambiarlo (ver CLAUDE.md).
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          # intentos-ia.json: cuántas veces se le pidió cada nota a Gemini (tope
          # de tres por nota, reels/reescritura.mjs). Sin guardarlo, el tope no
          # existiría: cada corrida empezaría de cero.
          # dolar-historia.json: la cotización de las 11 de cada día hábil, para
          # la nota propia del dólar y su comparación (web/lib/notas-propias.js).
          # fichas.json: lo que leyó la IA de cada nota y las repetidas (V2.2).
          # banco-fotos.json y fotos-notas/: el banco de fotos (28/09, "Las
          # fotos" en CRITERIO-EDITORIAL.md); sin este `git add`, la corrida
          # las armaba pero se perdían al terminar la corrida (encontrado el
          # 28/09, en la primera corrida real: 8 fotos armadas, cero subidas).
          # retiradas.json: los lunes pierde las de más de una semana.
          # celular-pendientes.json: lo que espera a una persona, cifrado para el
          # panel del celular (29/09; sólo cambia cuando cambia la lista).
          # celular-estado.json: cuántas notas hay y lo que va a salir hoy en las
          # redes, para el celular (redes/previa.mjs; es de lo ya publicado).
          # fusionadas.json: las notas repetidas con otra dirección y adónde
          # redirige cada una (29/09, web/lib/repetidas.js).
          git add web/data/portada.json web/data/archivo.json web/data/agenda.json web/data/intentos-ia.json web/data/dolar-historia.json web/data/clima-historia.json web/data/f1.json web/data/futbol.json web/data/fichas.json web/data/notas-por-dia.json web/data/uso-ia.json web/data/banco-fotos.json web/data/esperando-cuerpo.json web/data/vistas.json web/data/retiradas.json web/data/celular-pendientes.json web/data/celular-estado.json web/data/fusionadas.json web/data/historico/ web/public/fotos-notas/ web/public/escudos/
          if git diff --cached --quiet; then
            echo "Sin novedades: no hay nada que publicar."
          else
            git commit -m "Datos de la portada · $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
            # El reloj de las redes y el panel también guardan en este
            # repositorio: se traen sus cambios antes de subir los nuestros.
            # Si chocan en un archivo de datos, gana lo que acaba de armar esta
            # corrida (en un rebase, "theirs" es el commit propio que se está
            # reaplicando). El 25/09 un archivo.json subido a mano trabó dos
            # corridas seguidas. Y si otro sube justo en el medio, se reintenta.
            for intento in 1 2 3; do
              if ! git pull --rebase; then
                # Sólo los archivos en conflicto, y sólo si son de web/data/.
                chocan=$(git diff --name-only --diff-filter=U)
                echo "$chocan" | grep -qvE "^web/data/|^web/public/fotos-notas/" && { echo "Conflicto fuera de web/data o fotos-notas: $chocan"; git rebase --abort; exit 1; }
                echo "$chocan" | xargs -r git checkout --theirs --
                echo "$chocan" | xargs -r git add --
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              git push && break
              sleep 5
            done
            git fetch -q origin main
            [ "$(git rev-list --count origin/main..HEAD)" = 0 ] || { echo "No se pudo subir la portada después de tres intentos"; exit 1; }
          fi
