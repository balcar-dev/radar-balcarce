# Busca noticias y actualiza la web, sin depender de que haya una PC prendida.
#
# Corre en los servidores de GitHub cada media hora. Lo que hace es lo mismo
# que hace el panel en casa: leer las 22 fuentes, agrupar, clasificar, poner
# puntaje, y escribir web/data/portada.json.
#
# La diferencia está en las decisiones humanas. Acá no hay panel, así que se
# leen de web/data/decisiones.json, que el panel exporta al repositorio cada
# vez que alguien publica o descarta algo. O sea:
#
#   · Lo que sale solo (el semáforo verde, el clima, la farmacia, la agenda)
#     se actualiza siempre, con la computadora apagada.
#   · Lo que ustedes decidieron a mano se respeta hasta la última vez que el
#     panel estuvo prendido y sincronizó.
#
# Para que esto además PUBLIQUE, el repositorio tiene que estar conectado a
# Vercel (Settings → Git). Con eso, cada commit de acá dispara el deploy solo.

name: Actualizar la web

on:
  schedule:
    # Cada 30 minutos, pero en el minuto 7 y el 37 y no en punto ni y media:
    # esos dos son los más cargados de GitHub y ahí las corridas se demoraban
    # o se salteaban (cada 2 a 6 horas en vez de cada 30 minutos). El horario
    # es UTC: en Balcarce son 3 horas menos, pero como corre todo el día da lo
    # mismo.
    - cron: '7,37 * * * *'
  # Y a mano, desde la pestaña Actions, por si hace falta forzar una vuelta.
  workflow_dispatch:

# Que no se pisen dos corridas: la de las 10:30 no arranca si la de las 10:00
# todavía está trabajando.
concurrency:
  group: actualizar-web
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # para poder commitear portada.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Hace falta ANTES de las pruebas: desde que pruebas/ tiene tests que
      # tocan reels/ (voz.mjs, msedge-tts) y web/lib (pedir-clima.js, react),
      # "npm test" ya no corre con lo único que trae Node. Sin este paso,
      # esos dos archivos de prueba fallaban por "Cannot find package" y la
      # corrida entera se cortaba acá: pasó el 22/09, la web quedó sin
      # actualizarse desde la noche anterior.
      - name: Instalar
        run: npm ci --no-audit --no-fund
      - name: Instalar (web)
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Las pruebas corren antes de salir a buscar noticias: si la
      # clasificación o el parseo de la farmacia se rompieron, es preferible
      # dejar la web como está antes que publicar datos mal armados. La
      # corrida anterior sigue online y nadie ve nada roto.
      - name: Probar que nada se rompió
        run: npm test

      # No hace falta instalar nada: la ingesta usa sólo lo que trae Node
      # (fetch y expresiones regulares), sin una sola dependencia. Por eso
      # esto tarda segundos y no minutos.
      - name: Buscar noticias y armar los datos
        working-directory: web
        run: node scripts/generar-datos.mjs

      # El sitio se compila acá antes de publicar. Hasta ahora, un cambio
      # que rompía Next llegaba a Vercel y se descubría recién cuando el
      # deploy fallaba — con la web anterior sirviéndose mientras tanto,
      # pero sin que nadie se enterara de que dejó de actualizarse.
      #
      # Si no compila, no se commitea: la web se queda como está.
      - name: Compilar el sitio
        working-directory: web
        run: npm run build
        env:
          SITIO: https://radarbalcarce.com

      # Que lo importante haya quedado en el HTML. Sin esto, alguien toca
      # layout.js dentro de seis meses, se lleva puesto el Open Graph y no
      # se entera nadie hasta que una nota compartida llega pelada.
      - name: Revisar que el SEO siga en pie
        working-directory: web
        run: node scripts/revisar-seo.mjs

      - name: Guardar si cambió algo
        run: |
          git config user.name "Radar Balcarce"
          # Vercel valida la firma del commit contra GitHub antes de publicar,
          # asi que el mail tiene que ser uno que GitHub reconozca. Este es el
          # mail interno de la cuenta balcar-dev.
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/portada.json
          if git diff --cached --quiet; then
            echo "Sin novedades: no hay nada que publicar."
          else
            git commit -m "Datos de la portada · $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
            # El reloj de las redes también guarda su libro en este repositorio:
            # se traen sus cambios antes de subir los nuestros.
            git pull --rebase
            git push
          fi
