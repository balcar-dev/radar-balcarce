# Prueba a mano la generación de imágenes con Workers AI de Cloudflare (flux-1-schnell), dentro de las 10.000 neuronas diarias gratis del plan Workers.
# Genera 3 imágenes de ejemplo y las deja como archivo adjunto de la corrida. No escribe nada en el repositorio. Ver redes/probar-flux.mjs.
name: Probar imágenes con Workers AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SALIDA: salida-flux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generar
        run: node redes/probar-flux.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imagenes-flux
          path: salida-flux
          retention-days: 3
          if-no-files-found: ignore
