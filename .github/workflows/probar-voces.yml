# Prueba de voces (28/09): el modelo de voz definitivo con el perfil "locutora de
# radio" y una versión de hombre. No publica nada: sube los audios como archivos
# de la corrida (Actions → la corrida → Artifacts) para escucharlos.
#
# SE CORRE A MANO (Actions → "Probar voces" → Run workflow). Gasta unos pocos
# audios de la clave paga (centavos): no se dispara solo. Cuando la voz definitiva
# esté en producción este workflow se borra.
#
# SECRETO: GEMINI_API_KEY_REDES.

name: Probar voces

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'formatos = la locutora con tres formas de pasar las indicaciones; hombres = tres voces de hombre'
        type: choice
        options: [formatos, hombres]
        default: formatos
      formato:
        description: 'Sólo para "hombres": la forma de pasar las indicaciones'
        type: choice
        options: [corto, sistema, doc]
        default: corto

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # ffmpeg (para pasar el audio a mp3) viene con las dependencias.
      - run: npm ci --no-audit --no-fund

      - name: Generar los audios
        run: node reels/probar-voces.mjs "${{ github.event.inputs.modo }}" "${{ github.event.inputs.formato }}"
        env:
          GEMINI_API_KEY_REDES: ${{ secrets.GEMINI_API_KEY_REDES }}

      - uses: actions/upload-artifact@v4
        with:
          name: voces-${{ github.event.inputs.modo }}
          path: reels/salida/voces/
          retention-days: 3
