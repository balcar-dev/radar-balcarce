# Prueba a mano el flujo «nota → prompt de imagen (Gemini) → imagen (Workers AI)» con el prompt de bodegón sin personas de Hernán (16/10/2026).
# Usa la nota de Azul y dos notas del sitio. Deja las imágenes como adjunto. No escribe nada en el repositorio. Ver redes/probar-imagen-nota.mjs.
name: Probar imagen desde la nota

on:
  workflow_dispatch:
    inputs:
      nota:
        description: 'Id de una nota del sitio (por ejemplo 1ixp88o). Vacío = las de ejemplo.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY_REDACCION: ${{ secrets.GEMINI_API_KEY_REDACCION }}
      VIGILANTE_TOKEN: ${{ secrets.VIGILANTE_TOKEN }}
      SALIDA: salida-notas
      NOTA_ID: ${{ inputs.nota }}
      MOSTRAR_PEDIDO: 'si'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generar
        run: node redes/probar-imagen-nota.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imagenes-desde-la-nota
          path: salida-notas
          retention-days: 3
          if-no-files-found: ignore
