# Vigilancia: revisa que todo ande y avisa por WhatsApp si algo falla.
#
# Mira la web publicada, las corridas de los otros workflows, el reloj de redes
# y las piezas fijas del día (redes/vigilar.mjs). Un resumen "todo bien" sale
# a las 21. Los problemas se avisan una vez cada seis horas.
#
# EL DISPARADOR ES cron-job.org (un tercer trabajo, cada 30 minutos), igual que
# los otros dos: el planificador de GitHub no es puntual. La programación de
# abajo es sólo un respaldo.
#
# SECRETOS (Settings → Secrets and variables → Actions):
#   WHATSAPP_TELEFONO   el número con código de país, sin + ni espacios
#   WHATSAPP_APIKEY     la clave que da CallMeBot (ver redes/whatsapp.mjs)
# Sin ellos, corre igual y deja el resultado en el registro; sólo no avisa.

name: Vigilancia

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Revisar y avisar
        run: node redes/vigilar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}

      - name: Guardar lo avisado
        if: always()
        run: |
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/vigilancia.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Vigilancia: estado de avisos · $(date '+%d/%m %H:%M')"
            git pull --rebase
            git push
          fi
