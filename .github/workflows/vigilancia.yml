# Vigilancia: revisa que todo ande y avisa por WhatsApp si algo falla.
#
# Mira la web publicada, las corridas de los otros workflows, el reloj de redes
# y las piezas fijas del día (redes/vigilar.mjs). Los problemas se avisan una
# vez cada seis horas. Además (redes/avisos.mjs): notas que esperan a una
# persona, una noticia de Balcarce muy importante, lo que salió en redes, las
# estadísticas a las 9 y el resumen del día a las 21 (con las estadísticas).
# Todo en UN solo WhatsApp por corrida.
#
# EL DISPARADOR ES cron-job.org (un tercer trabajo, cada 30 minutos), igual que
# los otros dos: el planificador de GitHub no es puntual. La programación de
# abajo es sólo un respaldo.
#
# A mano (Actions → Vigilancia → Run workflow) se puede elegir "probar-resumen":
# manda UN WhatsApp con el resumen de las 21 tal cual, para ver cómo llega, y
# no guarda nada. Con "probar-cierre" corre el cierre del día de hoy contra Meta
# y muestra el informe y el WhatsApp que saldría, sin mandarlo ni guardar nada.
#
# EL CIERRE DEL DÍA (redes/vigilar.mjs, fechaDelCierre): a partir de las 23:30
# audita el contrato del día contra lo que Meta tiene publicado de verdad
# (redes/auditar-redes.mjs). Avisa por WhatsApp SÓLO si hay discrepancias
# (faltantes, duplicados, o libro y Meta que no coinciden); si todo cuadra, no
# manda nada: la línea "completos" viaja en el próximo mensaje normal.
#
# SECRETOS (Settings → Secrets and variables → Actions):
#   WHATSAPP_TELEFONO   el número con código de país, sin + ni espacios
#   WHATSAPP_APIKEY     la clave que da CallMeBot (ver redes/whatsapp.mjs)
#   CLOUDFLARE_ACCOUNT_ID       el ID de la cuenta de Cloudflare (ya estaba)
#   CLOUDFLARE_ANALYTICS_TOKEN  un token con permiso "Account Analytics: Read"
#                               (si no está, se prueba con CLOUDFLARE_API_TOKEN)
#   META_TOKEN          el mismo que publica: seguidores y estadísticas de redes, y
#                       el cierre del día (sólo lee; nunca se imprime)
# Sin ellos, corre igual y deja el resultado en el registro; sólo no avisa o no
# mide lo que le falta.

name: Vigilancia

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué hacer'
        type: choice
        options: [vigilar, probar-resumen, probar-cierre]
        default: vigilar
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Que "hoy" y las horas (las 9, las 21) sean las de Balcarce.
      TZ: America/Argentina/Buenos_Aires
    steps:
      # Siempre la última versión de main: el cierre del día compara contra el
      # libro, y un libro viejo lo haría avisar de más.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Revisar y avisar
        run: node redes/vigilar.mjs ${{ github.event.inputs.modo == 'probar-resumen' && '--probar-resumen' || github.event.inputs.modo == 'probar-cierre' && '--probar-cierre' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}

      - name: Guardar lo avisado y lo medido
        if: always() && github.event.inputs.modo != 'probar-resumen' && github.event.inputs.modo != 'probar-cierre'
        run: |
          git config user.name "Radar Balcarce"
          git config user.email "272334999+balcar-dev@users.noreply.github.com"
          git add web/data/vigilancia.json web/data/estadisticas.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
          else
            git commit -m "Vigilancia: estado de avisos · $(date '+%d/%m %H:%M')"
            git pull --rebase
            git push
          fi
