<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161A">
<title>Panel · Radar Balcarce</title>
<link rel="manifest" href="/panel/manifest.webmanifest">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --tinta: #14161A; --papel: #FFFFFF; --fondo: #F4F1EA; --linea: #E4DFD2; --suave: #5F635F; --texto: #22262B;
    --rojo: #C7381C; --rojo-oscuro: #9C2B15; --verde: #16615B; --ambar: #8A5A00; --ambar-fondo: #FFF4DC;
    --s-balcarce: #B91C1C; --s-politica: #3730A3; --s-policiales: #831843; --s-deportes: #0F766E; --s-futbol: #7C3AED;
    --s-feriado: #1E3A6E; --s-automovilismo: #B45309; --s-agro: #5A6B0A; --s-cultura: #9D2C8F; --s-economia: #8A6500; --s-tecnologia: #0B6FB8; --s-pais: #4B5563;
    --radio: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #1C1F24; --fondo: #121417; --linea: #2E333A; --suave: #A7ADB3; --texto: #ECEDEE;
      --ambar: #F2C46B; --ambar-fondo: #2B2415; --rojo: #E4583B; --verde: #5CC2B2;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--rojo); }
  .barra { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top)); background: var(--tinta); color: #fff; }
  .barra strong { font-size: 17px; letter-spacing: .01em; }
  .barra .etiqueta { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
  .barra .espacio { flex: 1; }
  .barra button { background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; color: #fff; min-height: 38px; padding: 0 14px; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 24px; }
  h1 { font-size: 22px; line-height: 1.2; margin: 8px 0 12px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin: 22px 0 8px; }
  p { margin: 8px 0; }
  .estado { font-size: 13.5px; color: var(--suave); margin: 4px 0 10px; }
  .tarjeta { display: block; width: 100%; text-align: left; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 12px 14px; margin: 0 0 10px; cursor: pointer; }
  .tarjeta .titulo { font-weight: 650; font-size: 16.5px; line-height: 1.3; margin: 4px 0; }
  .tarjeta .meta { font-size: 13px; color: var(--suave); }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #fff;
    background: var(--s-pais); border-radius: 4px; padding: 2px 6px; margin-right: 6px; vertical-align: 1px; }
  .motivo { display: inline-block; font-size: 12.5px; color: var(--ambar); background: var(--ambar-fondo); border-radius: 6px; padding: 2px 8px; margin-top: 4px; }
  .marca { font-size: 12px; font-weight: 700; color: var(--verde); margin-left: 6px; }
  .marca.espera { color: var(--ambar); }
  .marca.mal { color: var(--rojo); }
  .motivo.firme { color: var(--rojo); background: transparent; border: 1px solid var(--rojo); }
  .volver-mas { margin-bottom: 4px; }
  .tarjeta .meta { display: block; }
  #texto-pista { width: 100%; box-sizing: border-box; font: inherit; padding: 10px; border: 1px solid var(--linea); border-radius: var(--radio); background: var(--papel); color: inherit; }
  .caja p.bien { color: var(--verde); }
  .caja p.mal { color: #B91C1C; }
  .hallazgos { list-style: none; margin: 8px 0 0; padding: 0; }
  .hallazgo { font-size: 14.5px; line-height: 1.4; padding: 6px 0 6px 10px; border-left: 3px solid var(--linea); margin-top: 6px; }
  .hallazgo.alta { border-left-color: #B91C1C; }
  .hallazgo.media { border-left-color: #B45309; }
  .hallazgo.baja { border-left-color: var(--suave); }
  .hallazgo .meta { display: block; margin-top: 2px; }
  .tarjeta.revision { cursor: default; }
  .tarjeta.revision a { color: inherit; }
  .vacio { text-align: center; color: var(--suave); padding: 28px 8px; }
  .botones { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
  .boton { min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--linea); background: var(--papel); font-weight: 600; cursor: pointer; }
  .boton.principal { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .boton.peligro { color: var(--rojo); border-color: var(--rojo); }
  .boton[disabled] { opacity: .5; }
  .ancho { width: 100%; }
  label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; }
  input[type=text], input[type=password], input[type=search], textarea, select { width: 100%; padding: 12px; border: 1px solid var(--linea); border-radius: 10px; background: var(--papel); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  textarea.cuerpo { min-height: 260px; }
  .ayuda { font-size: 13px; color: var(--suave); margin-top: 4px; }
  .problemas { background: var(--ambar-fondo); color: var(--ambar); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .problemas ul { margin: 6px 0 0; padding-left: 18px; }
  .texto-nota { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; }
  .texto-nota .bajada { font-weight: 600; }
  .texto-nota .cuerpo { white-space: pre-line; }
  .fuentes { font-size: 14px; padding-left: 18px; }
  .fuentes li { margin: 6px 0; }
  details { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 10px 14px; margin: 12px 0; }
  summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  .pasos li { margin: 8px 0; }
  h3 { font-size: 16px; margin: 4px 0 6px; }
  .caja { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 10px 14px; margin: 0 0 10px; font-size: 15px; }
  .caja p { margin: 4px 0; }
  .aviso-motivo { background: var(--ambar-fondo); border-color: transparent; color: var(--texto); }
  .titulo-borrador { font-weight: 700; font-size: 17px; line-height: 1.3; margin-top: 0; }
  .que-es { margin: 0 0 10px; padding: 6px 12px; font-size: 14.5px; }
  .que-es summary { min-height: 28px; color: var(--suave); }
  .est { display: inline-block; font-size: 13px; font-weight: 600; }
  .est.ok { color: var(--verde); }
  .est.espera { color: var(--ambar); }
  .est.mal { color: var(--rojo); }
  .tarjeta .est { display: block; margin-top: 4px; font-weight: 500; }
  .cronograma { list-style: none; margin: 0; padding: 0; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); }
  .fila { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; padding: 10px 12px; border-top: 1px solid var(--linea); }
  .fila:first-child { border-top: 0; }
  .fila .hora { font-weight: 700; font-variant-numeric: tabular-nums; grid-row: span 2; }
  .fila .que { font-weight: 600; }
  .fila .meta { font-weight: 400; font-size: 13px; color: var(--suave); }
  .lista-simple, .notas-repaso { margin: 6px 0 10px; padding-left: 20px; }
  .lista-simple li, .notas-repaso li { margin: 6px 0; }
  .enlace-boton { display: flex; align-items: center; justify-content: center; text-decoration: none; color: inherit; }
  dialog.pregunta { width: min(92vw, 480px); border: 0; border-radius: 16px; padding: 18px; background: var(--papel); color: var(--texto); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  dialog.pregunta::backdrop { background: rgba(0,0,0,.45); }
  dialog.pregunta h2 { font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--texto); margin: 0 0 8px; }
  dialog.pregunta p { font-size: 15px; }
  dialog.pregunta .botones { margin-bottom: 0; }
  .pestanas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--papel); border-top: 1px solid var(--linea); padding-bottom: env(safe-area-inset-bottom); }
  .pestanas button { min-height: 58px; border: 0; background: transparent; font-size: 11.5px; font-weight: 600; color: var(--suave); cursor: pointer; padding: 0 2px; }
  .pestanas button[aria-current="page"] { color: var(--rojo); box-shadow: inset 0 3px 0 var(--rojo); }
  .pestanas .numero { display: block; font-size: 17px; }
  /* Arriba y no abajo: abajo tapaba los botones de la nota mientras estaba a la vista. */
  .aviso { position: fixed; left: 12px; right: 12px; top: calc(64px + env(safe-area-inset-top)); z-index: 9; background: var(--tinta); color: #fff;
    border-radius: 12px; padding: 12px 40px 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 14.5px; }
  .aviso .cerrar { position: absolute; top: 4px; right: 4px; margin: 0; min-height: 36px; min-width: 36px; padding: 0; background: transparent; color: #fff; font-size: 18px; }
  .aviso button { margin-top: 8px; background: #fff; color: var(--tinta); border: 0; border-radius: 8px; min-height: 38px; padding: 0 12px; font-weight: 700; }
  .girando { width: 38px; height: 38px; border: 4px solid var(--linea); border-top-color: var(--rojo); border-radius: 50%; animation: g 1s linear infinite; margin: 30px auto 12px; }
  @keyframes g { to { transform: rotate(360deg); } }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
  .check input { width: 22px; height: 22px; margin-top: 2px; }
  .sub { display: flex; gap: 8px; margin: 8px 0 12px; }
  .sub button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--linea); background: var(--papel); font-weight: 600; cursor: pointer; }
  .sub button[aria-current="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .filtros { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; margin: 0 -16px; padding-inline: 16px; }
  .filtros button { flex: 0 0 auto; min-height: 36px; border-radius: 999px; border: 1px solid var(--linea); background: var(--papel); padding: 0 12px; font-size: 13.5px; cursor: pointer; }
  .filtros button[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .cand { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 12px 14px; margin: 0 0 10px; }
  .cand.principal { border-color: var(--verde); box-shadow: inset 4px 0 0 var(--verde); }
  .cand.si { border-color: var(--verde); }
  .cand.opcional { border-color: var(--ambar); box-shadow: inset 4px 0 0 var(--ambar); }
  .cand.no { opacity: .55; }
  .cand .texto { margin: 6px 0; line-height: 1.4; }
  .cand .roles { display: grid; grid-template-columns: 1.5fr .8fr 1.2fr .8fr; gap: 6px; margin-top: 8px; }
  .cand .ver-nota { display: inline-block; margin: 4px 0; font-weight: 600; }
  .cand .roles button { min-height: 44px; border-radius: 10px; border: 1px solid var(--linea); background: transparent; font-weight: 600; cursor: pointer; }
  .cand .roles button[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  .marcas { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .marcas .motivo { margin: 0; }
  .barra-guardar { position: sticky; bottom: calc(66px + env(safe-area-inset-bottom)); padding: 8px 0; background: linear-gradient(to top, var(--fondo) 70%, transparent); }
  .datos li { margin: 6px 0; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .tile { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 10px 12px; }
  .tile-titulo { font-size: 12.5px; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }
  .tile-valor { font-size: 28px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .barras { list-style: none; margin: 0; padding: 0; }
  .barras li { margin: 0 0 12px; }
  .barras-linea { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
  .barras-valor { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .barras-fondo { height: 8px; background: var(--linea); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .barras .meta, .tile .meta { font-size: 13px; color: var(--suave); }
  .partes { list-style: none; margin: 6px 0 0; padding: 0; }
  .partes li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--linea); }
  .partes li:first-child { border-top: 0; }
  .partes .meta { flex-basis: 100%; font-size: 13px; color: var(--suave); }
  .partes .boton { min-height: 38px; margin-left: auto; }
  .barras-relleno { height: 100%; background: var(--verde); border-radius: 4px; }
  .demo { background: var(--ambar-fondo); color: var(--ambar); text-align: center; font-size: 13px; padding: 6px; }

  /* ============================================================================================================================
     REDISEÑO DEL 2/10 (Hernán: "varios botones que es esto están como cortados o se ven feo… un rediseño con botones más fáciles y
     entendibles"). Una sola jerarquía de botones, pestañas con ícono, tarjetas con franja de color por sección y una barra de
     acciones fija en la nota. Va al final para pisar lo de arriba sin tocarlo.
     ============================================================================================================================ */
  :root { --radio: 14px; --verde-fondo: #E4F2EF; --rojo-fondo: #FBE9E4; --sombra: 0 1px 2px rgba(20,22,26,.06), 0 2px 8px rgba(20,22,26,.05); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --verde-fondo: #16302D; --rojo-fondo: #33201B; --sombra: 0 1px 2px rgba(0,0,0,.4); }
  }
  main { padding-top: 14px; }
  h1 { font-size: 26px; letter-spacing: -.01em; margin: 6px 0 4px; }
  h2 { font-size: 13px; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--linea); }

  /* Botones: uno principal por pantalla (rojo), los demás de contorno, el que borra de rojo suave. */
  .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 12px;
    border: 1.5px solid var(--linea); background: var(--papel); color: var(--texto); font-size: 16px; font-weight: 650; line-height: 1.2; text-align: center; text-decoration: none; cursor: pointer; }
  .boton:active { transform: scale(.985); }
  .boton.principal { background: var(--rojo); border-color: var(--rojo); color: #fff; box-shadow: 0 2px 0 var(--rojo-oscuro); }
  .boton.peligro { background: var(--rojo-fondo); border-color: transparent; color: var(--rojo); }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .botones > .boton, .botones > a.boton { width: 100%; min-width: 0; padding: 0 12px; }
  .botones > .ancho, .botones > .principal:only-child { grid-column: 1 / -1; }
  .botones > .principal { grid-column: 1 / -1; }
  .ancho { width: 100%; }
  /* Íconos en los botones, por lo que hacen (así el texto no cambia). */
  [data-accion="publicar-ia"]::before, [data-accion="aprobar-pieza"]::before, [data-accion="aprobar-feriado"]::before, [data-accion="volver-a-publicar"]::before { content: "✓"; }
  [data-accion="escribir"]::before, [data-accion="pedir-reescribir"]::before, [data-accion="otra-version"]::before { content: "✨"; }
  [data-accion="a-mano"]::before { content: "✍"; }
  [data-accion="descartar"]::before, [data-accion="retirar"]::before, [data-accion="sacar-pieza"]::before { content: "✕"; }
  [data-accion="redes"]::before { content: "📣"; }
  [data-accion="buscar-foto"]::before { content: "📷"; }
  [data-accion="deshacer"]::before, [data-accion="deshacer-retiro"]::before { content: "↶"; }
  [data-accion="actualizar-web"]::before { content: "⟳"; }
  [data-accion="cambiar-pieza"]::before, [data-accion="cambiar-feriado"]::before { content: "✎"; }
  .aviso button::before, .pregunta button::before { content: none !important; }
  /* "Volver": un enlace con flecha, no un botón más. */
  button.boton[data-accion^="volver"], button.boton.volver-mas { background: transparent; border: 0; box-shadow: none; justify-content: flex-start; min-height: 44px; padding: 0 6px 0 0; width: auto; color: var(--rojo); font-weight: 650; font-size: 16px; }

  /* La barra de abajo: ícono y rótulo, con el número en un globito. */
  .pestanas { grid-template-columns: repeat(5, 1fr); box-shadow: 0 -4px 16px rgba(20,22,26,.08); }
  .pestanas button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 62px; font-size: 12px; font-weight: 650; position: relative; }
  .pestanas .icono { position: relative; display: block; width: 26px; height: 26px; }
  .pestanas .icono svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pestanas .numero { position: absolute; top: -6px; left: 15px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--rojo); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 19px; text-align: center; font-variant-numeric: tabular-nums; }
  .pestanas .numero.suave { background: var(--suave); }
  .pestanas .numero.ok { background: var(--verde); }
  .pestanas button[aria-current="page"] { color: var(--rojo); box-shadow: inset 0 3px 0 var(--rojo); background: linear-gradient(to bottom, var(--rojo-fondo), transparent 70%); }

  /* Las tarjetas: franja de color de la sección, más aire y la lectura de arriba abajo. */
  .tarjeta { position: relative; border: 1px solid var(--linea); border-left: 5px solid var(--franja, var(--linea)); border-radius: var(--radio); padding: 14px 16px; margin: 0 0 12px; box-shadow: var(--sombra); }
  .tarjeta:active { background: var(--fondo); }
  .tarjeta .titulo { font-size: 17.5px; font-weight: 700; line-height: 1.3; margin: 6px 0 8px; }
  .tarjeta .meta { font-size: 13px; margin-right: 8px; }
  .tarjeta > div:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .tarjeta .est { display: block; margin-top: 8px; padding: 8px 10px; border-radius: 10px; font-size: 14px; font-weight: 500; line-height: 1.4; }
  .tarjeta .est strong { font-weight: 750; }
  .tarjeta .est.ok { background: var(--verde-fondo); color: var(--verde); }
  .tarjeta .est.espera { background: var(--ambar-fondo); color: var(--ambar); }
  .tarjeta .est.mal { background: var(--rojo-fondo); color: var(--rojo); }
  .tarjeta .motivo { margin-top: 8px; padding: 6px 10px; font-size: 14px; }
  .tarjeta .marca { margin: 0; padding: 2px 8px; border-radius: 999px; background: var(--verde-fondo); }
  .tarjeta .marca.espera { background: var(--ambar-fondo); }
  .tarjeta .marca.mal { background: var(--rojo-fondo); }
  .chip { border-radius: 6px; padding: 3px 8px; font-size: 11.5px; margin: 0; }

  /* "¿Qué es esto?": una píldora chica, no una barra; lo que explica aparece abajo, en una caja. */
  .que-es { background: transparent; border: 0; padding: 0; margin: 4px 0 12px; }
  .que-es summary { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border: 1.5px solid var(--linea); border-radius: 999px; background: var(--papel); font-size: 14px; font-weight: 600; color: var(--suave); list-style: none; }
  .que-es summary::-webkit-details-marker { display: none; }
  .que-es summary::before { content: "ⓘ"; font-size: 16px; }
  .que-es[open] summary { color: var(--texto); border-color: var(--suave); }
  .que-es p { margin: 10px 0 0; padding: 12px 14px; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); font-size: 14.5px; line-height: 1.5; }

  /* Subpestañas y filtros: botones grandes y claros. */
  .sub { gap: 6px; padding: 4px; background: var(--linea); border-radius: 14px; }
  .sub button { min-height: 44px; border: 0; background: transparent; border-radius: 10px; font-size: 14.5px; color: var(--suave); }
  .sub button[aria-current="true"] { background: var(--papel); color: var(--texto); box-shadow: var(--sombra); }
  .filtros button { min-height: 40px; font-size: 14px; }

  /* Cajas y avisos. */
  .caja { border-radius: var(--radio); padding: 12px 16px; font-size: 15.5px; line-height: 1.45; box-shadow: var(--sombra); }
  .problemas { border-radius: var(--radio); padding: 12px 16px; line-height: 1.45; }
  input[type=search] { min-height: 50px; border-radius: 12px; font-size: 16px; }

  /* La nota abierta: la barra de acciones queda siempre a la vista. */
  .barra-acciones { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--papel); border-top: 1px solid var(--linea); box-shadow: 0 -4px 16px rgba(20,22,26,.1); }
  .barra-acciones .boton { width: 100%; min-height: 52px; }
  .barra-acciones .boton:only-child { grid-column: 1 / -1; }
  .espacio-barra { height: 84px; }
  .tarjeta-texto { white-space: pre-line; }

  /* La lista de "Más": cada cosa con su ícono y su explicación. */
  .tarjeta > div.menu-item:first-child { display: grid; grid-template-columns: 44px 1fr 16px; align-items: center; gap: 12px; flex-wrap: nowrap; }
  .menu-icono { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--fondo); font-size: 22px; }
  .menu-item .titulo { margin: 0 0 2px; }
  /* La pantalla Hoy (8/10/2026): el número grande de lo que espera, en el lugar del ícono. */
  .numero-hoy { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--rojo-fondo); color: var(--rojo); font-size: 20px; font-weight: 800; }
  .menu-item .flecha { color: var(--suave); font-size: 24px; }

  /* La revisión: lo corregido y lo que falta mirar. */
  /* Más parecido a la página: los títulos con serif (la página usa Source Serif 4; acá no se puede cargar nada de afuera, así que Georgia), el logo con "Balcarce" en rojo. */
  :root { --f-titulo: Georgia, "Source Serif 4", "Times New Roman", serif; }
  h1, .tarjeta .titulo, .resultado h1 { font-family: var(--f-titulo); font-weight: 800; }
  .barra .logo { font-family: var(--f-titulo); font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .barra .logo span { color: #FF6A4D; }
  .barra { border-bottom: 3px solid var(--rojo); }
  /* Lo que se está haciendo en la nube: una franja fija bajo la barra, con el reloj y el paso. */
  .cabecera { position: sticky; top: 0; z-index: 7; }
  .cabecera .barra { position: static; }
  .progreso { background: var(--ambar-fondo); color: var(--ambar); border-bottom: 1px solid var(--linea); padding: 8px 16px; font-size: 14px; line-height: 1.35; }
  .progreso .tarea { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; padding: 2px 0; }
  .progreso .reloj { font-variant-numeric: tabular-nums; font-weight: 700; }
  .progreso .paso { flex-basis: 100%; font-size: 13px; opacity: .9; }
  .boton[disabled] { opacity: .55; }
  .resultado { text-align: center; padding: 28px 8px 8px; }
  .resultado-icono { display: grid; place-items: center; width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 50%; background: var(--verde-fondo); color: var(--verde); font-size: 42px; font-weight: 700; }
  .resultado h1 { margin-bottom: 10px; }
  .resultado p { font-size: 16px; }
  .botones .boton[data-accion="foto-de-fuente"] { grid-column: 1 / -1; }
  .hallazgo.ok { border-left-color: var(--verde); }
  .hallazgo .antes { text-decoration: line-through; color: var(--rojo); }
  .hallazgo .despues { color: var(--verde); font-weight: 650; }
  main > p > .chip + .meta { margin-left: 10px; }
  h1 + .caja, h1 + .que-es + .estado { margin-top: 14px; }
  .caja .boton { margin-top: 10px; }
</style>
</head>

<div class="cabecera">
<header class="barra">
  <strong class="logo">Radar <span>Balcarce</span></strong><span class="etiqueta">Panel</span>
  <span class="espacio"></span>
  <button type="button" id="recargar" hidden aria-label="Volver a cargar">Recargar</button>
</header>
<div id="progreso" class="progreso" hidden aria-live="polite"></div>
</div>
<div id="demo" class="demo" hidden>Modo de prueba: nada de lo que hagas acá se guarda.</div>
<main id="app"><p class="vacio">Cargando…</p></main>
<nav class="pestanas" id="pestanas" hidden aria-label="Secciones del panel"></nav>
