<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161A">
<title>Panel · Radar Balcarce</title>
<link rel="manifest" href="/panel/manifest.webmanifest">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --tinta: #14161A; --papel: #FFFFFF; --fondo: #F4F1EA; --linea: #E4DFD2; --suave: #5F635F; --texto: #22262B;
    --rojo: #C7381C; --rojo-oscuro: #9C2B15; --verde: #16615B; --ambar: #8A5A00; --ambar-fondo: #FFF4DC;
    --s-balcarce: #B91C1C; --s-politica: #3730A3; --s-policiales: #831843; --s-deportes: #0F766E; --s-futbol: #15803D;
    --s-automovilismo: #B45309; --s-agro: #4D7C0F; --s-cultura: #9D2C8F; --s-economia: #8A6500; --s-tecnologia: #0B6FB8; --s-pais: #4B5563;
    --radio: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #1C1F24; --fondo: #121417; --linea: #2E333A; --suave: #A7ADB3; --texto: #ECEDEE;
      --ambar: #F2C46B; --ambar-fondo: #2B2415; --rojo: #E4583B; --verde: #5CC2B2;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--rojo); }
  .barra { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top)); background: var(--tinta); color: #fff; }
  .barra strong { font-size: 17px; letter-spacing: .01em; }
  .barra .etiqueta { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
  .barra .espacio { flex: 1; }
  .barra button { background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; color: #fff; min-height: 38px; padding: 0 14px; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 24px; }
  h1 { font-size: 22px; line-height: 1.2; margin: 8px 0 12px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin: 22px 0 8px; }
  p { margin: 8px 0; }
  .estado { font-size: 13.5px; color: var(--suave); margin: 4px 0 10px; }
  .tarjeta { display: block; width: 100%; text-align: left; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio);
    padding: 12px 14px; margin: 0 0 10px; cursor: pointer; }
  .tarjeta .titulo { font-weight: 650; font-size: 16.5px; line-height: 1.3; margin: 4px 0; }
  .tarjeta .meta { font-size: 13px; color: var(--suave); }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #fff;
    background: var(--s-pais); border-radius: 4px; padding: 2px 6px; margin-right: 6px; vertical-align: 1px; }
  .motivo { display: inline-block; font-size: 12.5px; color: var(--ambar); background: var(--ambar-fondo); border-radius: 6px; padding: 2px 8px; margin-top: 4px; }
  .marca { font-size: 12px; font-weight: 700; color: var(--verde); margin-left: 6px; }
  .vacio { text-align: center; color: var(--suave); padding: 28px 8px; }
  .botones { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
  .boton { min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--linea); background: var(--papel); font-weight: 600; cursor: pointer; }
  .boton.principal { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .boton.peligro { color: var(--rojo); border-color: var(--rojo); }
  .boton[disabled] { opacity: .5; }
  .ancho { width: 100%; }
  label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; }
  input[type=text], input[type=password], input[type=search], textarea, select { width: 100%; padding: 12px; border: 1px solid var(--linea); border-radius: 10px; background: var(--papel); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  textarea.cuerpo { min-height: 260px; }
  .ayuda { font-size: 13px; color: var(--suave); margin-top: 4px; }
  .problemas { background: var(--ambar-fondo); color: var(--ambar); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .problemas ul { margin: 6px 0 0; padding-left: 18px; }
  .texto-nota { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; }
  .texto-nota .bajada { font-weight: 600; }
  .texto-nota .cuerpo { white-space: pre-line; }
  .fuentes { font-size: 14px; padding-left: 18px; }
  .fuentes li { margin: 6px 0; }
  details { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 10px 14px; margin: 12px 0; }
  summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  .pasos li { margin: 8px 0; }
  h3 { font-size: 16px; margin: 4px 0 6px; }
  .caja { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 10px 14px; margin: 0 0 10px; font-size: 15px; }
  .caja p { margin: 4px 0; }
  .aviso-motivo { background: var(--ambar-fondo); border-color: transparent; color: var(--texto); }
  .titulo-borrador { font-weight: 700; font-size: 17px; line-height: 1.3; margin-top: 0; }
  .que-es { margin: 0 0 10px; padding: 6px 12px; font-size: 14.5px; }
  .que-es summary { min-height: 28px; color: var(--suave); }
  .est { display: inline-block; font-size: 13px; font-weight: 600; }
  .est.ok { color: var(--verde); }
  .est.espera { color: var(--ambar); }
  .est.mal { color: var(--rojo); }
  .tarjeta .est { display: block; margin-top: 4px; font-weight: 500; }
  .cronograma { list-style: none; margin: 0; padding: 0; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); }
  .fila { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; padding: 10px 12px; border-top: 1px solid var(--linea); }
  .fila:first-child { border-top: 0; }
  .fila .hora { font-weight: 700; font-variant-numeric: tabular-nums; grid-row: span 2; }
  .fila .que { font-weight: 600; }
  .fila .meta { font-weight: 400; font-size: 13px; color: var(--suave); }
  .lista-simple, .notas-repaso { margin: 6px 0 10px; padding-left: 20px; }
  .lista-simple li, .notas-repaso li { margin: 6px 0; }
  .enlace-boton { display: flex; align-items: center; justify-content: center; text-decoration: none; color: inherit; }
  dialog.pregunta { width: min(92vw, 480px); border: 0; border-radius: 16px; padding: 18px; background: var(--papel); color: var(--texto); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  dialog.pregunta::backdrop { background: rgba(0,0,0,.45); }
  dialog.pregunta h2 { font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--texto); margin: 0 0 8px; }
  dialog.pregunta p { font-size: 15px; }
  dialog.pregunta .botones { margin-bottom: 0; }
  .pestanas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--papel); border-top: 1px solid var(--linea); padding-bottom: env(safe-area-inset-bottom); }
  .pestanas button { min-height: 58px; border: 0; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--suave); cursor: pointer; padding: 0 2px; }
  .pestanas button[aria-current="page"] { color: var(--rojo); box-shadow: inset 0 3px 0 var(--rojo); }
  .pestanas .numero { display: block; font-size: 17px; }
  /* Arriba y no abajo: abajo tapaba los botones de la nota mientras estaba a la vista. */
  .aviso { position: fixed; left: 12px; right: 12px; top: calc(64px + env(safe-area-inset-top)); z-index: 9; background: var(--tinta); color: #fff;
    border-radius: 12px; padding: 12px 40px 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 14.5px; }
  .aviso .cerrar { position: absolute; top: 4px; right: 4px; margin: 0; min-height: 36px; min-width: 36px; padding: 0; background: transparent; color: #fff; font-size: 18px; }
  .aviso button { margin-top: 8px; background: #fff; color: var(--tinta); border: 0; border-radius: 8px; min-height: 38px; padding: 0 12px; font-weight: 700; }
  .girando { width: 38px; height: 38px; border: 4px solid var(--linea); border-top-color: var(--rojo); border-radius: 50%; animation: g 1s linear infinite; margin: 30px auto 12px; }
  @keyframes g { to { transform: rotate(360deg); } }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
  .check input { width: 22px; height: 22px; margin-top: 2px; }
  .demo { background: var(--ambar-fondo); color: var(--ambar); text-align: center; font-size: 13px; padding: 6px; }
</style>
</head>
<body>
<header class="barra">
  <strong>Radar Balcarce</strong><span class="etiqueta">Panel</span>
  <span class="espacio"></span>
  <button type="button" id="recargar" hidden aria-label="Volver a cargar">Recargar</button>
</header>
<div id="demo" class="demo" hidden>Modo de prueba: nada de lo que hagas acá se guarda.</div>
<main id="app"><p class="vacio">Cargando…</p></main>
<nav class="pestanas" id="pestanas" hidden aria-label="Secciones del panel"></nav>
<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">El panel necesita JavaScript.</p></noscript>
<script type="module" src="/panel/app.js"></script>
</body>
</html>
